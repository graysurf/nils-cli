[workspace]
members = [
  "crates/nils-common",
  "crates/nils-term",
  "crates/nils-test-support",
  "crates/cli-template",
  "crates/memo-cli",
  "crates/codex-cli",
  "crates/fzf-cli",
  "crates/git-scope", "crates/git-summary", "crates/git-lock", "crates/git-cli",
  "crates/image-processing",
  "crates/macos-agent",
  "crates/screen-record",
  "crates/api-testing-core",
  "crates/api-rest",
  "crates/api-gql",
  "crates/api-grpc",
  "crates/api-websocket",
  "crates/api-test",
  "crates/semantic-commit",
  "crates/plan-tooling",
  "crates/plan-issue-cli",
  "crates/agent-docs",
  "crates/agent-out",
  "crates/gemini-cli",
]
resolver = "2"

[workspace.package]
# Track the edition for all workspace crates in one place. Individual
# crates can still override this value, but keeping it here means new
# crates created with `cargo new -w ...` automatically inherit the 2024
# edition.
edition = "2024"
license = "MIT"
version = "0.8.2"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "=4.6.3"
directories = "6"
pretty_assertions = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
indicatif = "0.18"

[profile.dev]
# Faster dev/test link times: drop full DWARF (keep line tables so backtraces
# remain accurate) and leave debug info in .o files instead of packing a .dSYM
# on macOS. On this workspace (~25 crates, 2400+ tests) the link-heavy phase is
# the dev-loop bottleneck; these two flags cut rebuild/link time significantly
# with no effect on test semantics.
debug = "line-tables-only"
split-debuginfo = "unpacked"
