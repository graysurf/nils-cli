[workspace]
members = [
  "crates/nils-common",
  "crates/nils-build-info",
  "crates/nils-scrub",
  "crates/nils-markdown",
  "crates/nils-term",
  "crates/nils-test-support",
  "crates/cli-template",
  "crates/agent-runtime",
  "crates/agent-memory",
  "crates/memo",
  "crates/claude-cli",
  "crates/codex-cli",
  "crates/opencode-cli",
  "crates/docker-tools",
  "crates/fzf-cli",
  "crates/git-scope", "crates/git-summary", "crates/git-lock", "crates/git-cli",
  "crates/image-processing",
  "crates/macos-agent",
  "crates/screen-record",
  "crates/api-testing-core",
  "crates/api-rest",
  "crates/api-gql",
  "crates/api-grpc",
  "crates/api-websocket",
  "crates/api-test",
  "crates/semantic-commit",
  "crates/plan-archive",
  "crates/plan-tooling",
  "crates/plan-issue",
  "crates/agent-docs",
  "crates/agent-out",
  "crates/agent-scope-lock",
  "crates/nils-evidence",
  "crates/web-evidence",
  "crates/agent-workflow-primitives",
  "crates/gemini-cli",
  "crates/forge-cli",
  "crates/zsh-kit",
]
resolver = "2"

[workspace.package]
# Track the edition for all workspace crates in one place. Individual
# crates can still override this value, but keeping it here means new
# crates created with `cargo new -w ...` automatically inherit the 2024
# edition.
edition = "2024"
license = "MIT"
version = "1.9.4"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "string"] }
clap_complete = "=4.6.5"
directories = "6"
indexmap = { version = "2", features = ["serde"] }
pretty_assertions = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.11"
shell-words = "1"
tera = "1"
thiserror = "2"
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
indicatif = "0.18"

[profile.dev]
# Faster dev/test link times: drop full DWARF (keep line tables so backtraces
# remain accurate) and leave debug info in .o files instead of packing a .dSYM
# on macOS. On this workspace (~25 crates, 2400+ tests) the link-heavy phase is
# the dev-loop bottleneck; these two flags cut rebuild/link time significantly
# with no effect on test semantics.
debug = "line-tables-only"
split-debuginfo = "unpacked"
