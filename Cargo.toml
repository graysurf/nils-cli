[workspace]
members = [
  "crates/nils-common",
  "crates/nils-build-info",
  "crates/nils-provider-resume",
  "crates/nils-scrub",
  "crates/nils-markdown",
  "crates/nils-term",
  "crates/nils-test-support",
  "crates/cli-template",
  "crates/agent-runtime",
  "crates/agent-memory",
  "crates/agent-hook",
  "crates/memo",
  "crates/agent-session",
  "crates/claude-cli",
  "crates/codex-cli",
  "crates/opencode-cli",
  "crates/docker-tools",
  "crates/fzf-cli",
  "crates/git-scope", "crates/git-summary", "crates/git-lock", "crates/git-cli",
  "crates/image-processing",
  "crates/macos-agent",
  "crates/screen-record",
  "crates/secrets",
  "crates/api-testing-core",
  "crates/api-rest",
  "crates/api-gql",
  "crates/api-grpc",
  "crates/api-websocket",
  "crates/api-test",
  "crates/semantic-commit",
  "crates/plan-archive",
  "crates/plan-tooling",
  "crates/plan-issue",
  "crates/agent-docs",
  "crates/agent-out",
  "crates/agent-scope-lock",
  "crates/nils-evidence",
  "crates/web-evidence",
  "crates/agent-workflow-primitives",
  "crates/gemini-cli",
  "crates/forge-cli",
  "crates/github-app-cli",
  "crates/zsh-kit",
]
resolver = "2"

[workspace.package]
# Track the edition for all workspace crates in one place. Individual
# crates can still override this value, but keeping it here means new
# crates created with `cargo new -w ...` automatically inherit the 2024
# edition.
edition = "2024"
license = "MIT"
version = "1.26.1"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "string", "unstable-ext"] }
# Pinned EXACT on purpose: clap_complete's generated completion-script output can
# change between releases, which would break the completion-matrix CI baseline
# (completion-freshness/flag-parity audits). Bump deliberately and regenerate the
# completion assets rather than letting this float to `^4.6`.
#
# `unstable-dynamic` enables the `CompleteEnv` + `engine::ArgValueCandidates`
# runtime-completion path used by `completion_engine=dynamic` CLIs. It is behind
# clap_complete's explicit unstable gate and pulls `shlex 1.x` + `is_executable`
# (skip-listed in `deny.toml`); the exact `=4.6.5` pin keeps the emitted dynamic
# registration stub version-matched to the shipped binary. `clap`'s
# `unstable-ext` is required for `Arg::add` used to attach dynamic value
# providers. Both are opt-in per CLI; static `generate()` remains the default.
clap_complete = { version = "=4.6.7", features = ["unstable-dynamic"] }
directories = "6"
indexmap = { version = "2", features = ["serde"] }
# Forward-standard datetime library: NEW crates and new date/time code use
# `jiff` (not `chrono` / `time`). Existing chrono/time crates are grandfathered.
# Already present in-tree transitively via the jaq stack, so this adds no build
# cost. See docs/runbooks/new-cli-crate-development-standard.md.
jiff = "0.2"
pretty_assertions = "1"
pulldown-cmark = "0.13.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.11"
shell-words = "1"
minijinja = "2"
thiserror = "2"
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
indicatif = "0.18"
# Async HTTP + WebSocket server stack for `agent-session serve` — the first
# server in the workspace. axum 0.8 unifies on the hyper 1.x / tower 0.5 /
# tokio 1.x already resolved transitively via reqwest's blocking client. The
# `serve` subcommand builds its own runtime; the rest of the workspace stays sync.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "fs", "sync", "time", "signal"] }
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
getrandom = "0.3"
libc = "0.2"

[profile.dev]
# Faster dev/test link times: drop full DWARF (keep line tables so backtraces
# remain accurate) and leave debug info in .o files instead of packing a .dSYM
# on macOS. On this workspace (~25 crates, 2400+ tests) the link-heavy phase is
# the dev-loop bottleneck; these two flags cut rebuild/link time significantly
# with no effect on test semantics.
debug = "line-tables-only"
split-debuginfo = "unpacked"
