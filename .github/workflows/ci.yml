name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      docs_only: ${{ steps.detect.outputs.docs_only }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect docs-only change set
        id: detect
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ -n "${PR_BASE_SHA}" ]; then
            base="${PR_BASE_SHA}"
          else
            base="${PUSH_BEFORE_SHA}"
          fi
          # Any detection error falls back to "false" so the full Rust jobs run
          # rather than leaving the release-gated checks unresolved.
          docs_only="$(bash scripts/ci/detect-docs-only.sh --base "${base}" 2>/dev/null || true)"
          case "${docs_only}" in
            true|false) ;;
            *) docs_only=false ;;
          esac
          echo "docs_only=${docs_only}" >> "$GITHUB_OUTPUT"
          echo "docs_only=${docs_only} (base=${base})"

  cargo_deny:
    name: cargo-deny (advisories + bans)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Run cargo-deny (RUSTSEC advisories + duplicate-version bans)
        run: bash scripts/ci/cargo-deny-audit.sh

  test:
    needs: changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install zsh + xvfb + ripgrep + tmux
        run: sudo apt-get update && sudo apt-get install -y zsh xvfb xauth ripgrep tmux

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Provision systemd user scopes
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          uid="$(id -u)"
          sudo loginctl enable-linger "${USER}"
          sudo systemctl start "user@${uid}.service"
          echo "XDG_RUNTIME_DIR=/run/user/${uid}" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/${uid}/bus" >> "$GITHUB_ENV"
          test -S "/run/user/${uid}/systemd/private"

      - name: Require agent-session cgroup containment
        if: needs.changes.outputs.docs_only != 'true'
        env:
          AGENT_SESSION_TEST_REQUIRE_CGROUP: "1"
        run: |
          setsid --wait cargo test -p nils-agent-session --lib \
            tests::delete_kills_a_detached_descendant_inside_a_pinned_tmux_control_group \
            -- --exact --nocapture

      - name: Nils CLI checks (includes third-party-artifacts-audit, completion audits, docs-hygiene-audit, test-stale-audit)
        env:
          NILS_CLI_TEST_RUNNER: nextest
        run: |
          if [ "${{ needs.changes.outputs.docs_only }}" = "true" ]; then
            bash scripts/ci/nils-cli-checks-entrypoint.sh --docs-only
          else
            bash scripts/ci/nils-cli-checks-entrypoint.sh --xvfb
          fi

      - name: Publish JUnit report
        if: always() && hashFiles('target/nextest/ci/junit.xml') != ''
        uses: mikepenz/action-junit-report@v6
        with:
          token: ${{ github.token }}
          check_name: JUnit Test Report
          report_paths: target/nextest/ci/junit.xml
          detailed_summary: true
          group_suite: true
          include_passed: true

      - name: Upload JUnit XML
        if: always() && hashFiles('target/nextest/ci/junit.xml') != ''
        uses: actions/upload-artifact@v7
        with:
          name: junit-nextest
          path: target/nextest/ci/junit.xml

  test_macos:
    needs: changes
    runs-on: macos-14
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install bash + ripgrep
        run: |
          if ! /opt/homebrew/bin/bash --version >/dev/null 2>&1; then
            brew install bash
          fi
          if ! command -v rg >/dev/null 2>&1; then
            brew install ripgrep
          fi

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Nils CLI checks (includes third-party-artifacts-audit, completion audits, docs-hygiene-audit, test-stale-audit)
        env:
          NILS_CLI_TEST_RUNNER: nextest
        run: |
          if [ "${{ needs.changes.outputs.docs_only }}" = "true" ]; then
            /opt/homebrew/bin/bash scripts/ci/nils-cli-checks-entrypoint.sh --docs-only
          else
            /opt/homebrew/bin/bash scripts/ci/nils-cli-checks-entrypoint.sh
          fi

      - name: Publish JUnit report
        if: always() && hashFiles('target/nextest/ci/junit.xml') != ''
        uses: mikepenz/action-junit-report@v6
        with:
          token: ${{ github.token }}
          check_name: JUnit Test Report (macOS)
          report_paths: target/nextest/ci/junit.xml
          detailed_summary: true
          group_suite: true
          include_passed: true

      - name: Upload JUnit XML
        if: always() && hashFiles('target/nextest/ci/junit.xml') != ''
        uses: actions/upload-artifact@v7
        with:
          name: junit-nextest-macos
          path: target/nextest/ci/junit.xml

  coverage:
    needs: changes
    runs-on: macos-14
    permissions:
      contents: read
      pull-requests: write
    env:
      COVERAGE_FAIL_UNDER_LINES: "85"
    steps:
      # Docs-only change sets skip every coverage step (step-level, never
      # job-level) so this check still concludes `success` and the release gate
      # in release.yml stays satisfied on docs-only tagged commits.
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        if: needs.changes.outputs.docs_only != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache cargo
        if: needs.changes.outputs.docs_only != 'true'
        uses: Swatinem/rust-cache@v2

      - name: Install cargo tools
        if: needs.changes.outputs.docs_only != 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: |
            cargo-llvm-cov
            cargo-nextest

      - name: Clear previous coverage outputs
        if: needs.changes.outputs.docs_only != 'true'
        run: rm -rf target/coverage && mkdir -p target/coverage

      - name: Generate LCOV report
        if: needs.changes.outputs.docs_only != 'true'
        run: cargo llvm-cov nextest --profile ci --workspace --lcov --output-path target/coverage/lcov.info --fail-under-lines "$COVERAGE_FAIL_UNDER_LINES"

      - name: Generate HTML report
        if: always() && needs.changes.outputs.docs_only != 'true' && hashFiles('target/coverage/lcov.info') != ''
        run: cargo llvm-cov report --html --output-dir target/coverage

      - name: Run doctests (not included in coverage)
        if: needs.changes.outputs.docs_only != 'true'
        run: cargo test --workspace --doc

      - name: Coverage summary
        if: always() && needs.changes.outputs.docs_only != 'true'
        run: |
          env GITHUB_STEP_SUMMARY=/dev/stdout bash scripts/ci/coverage-summary.sh target/coverage/lcov.info \
            | tee target/coverage/coverage-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: PR comment (sticky coverage summary)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false && needs.changes.outputs.docs_only != 'true' && hashFiles('target/coverage/lcov.info') != ''
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: coverage
          path: target/coverage/coverage-summary.md

      - name: Upload coverage LCOV
        if: always() && needs.changes.outputs.docs_only != 'true' && hashFiles('target/coverage/lcov.info') != ''
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: target/coverage/lcov.info
          retention-days: 7

      - name: Upload coverage HTML
        if: always() && needs.changes.outputs.docs_only != 'true' && hashFiles('target/coverage/html/index.html') != ''
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: target/coverage/html
          retention-days: 7

      - name: Cleanup coverage outputs (avoid bloating cache)
        if: always() && needs.changes.outputs.docs_only != 'true'
        run: rm -rf target/coverage

  coverage_badge:
    if: github.event_name == 'push' && needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    needs:
      - changes
      - coverage
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download coverage LCOV
        uses: actions/download-artifact@v8
        with:
          name: coverage-lcov
          path: target/coverage

      - name: Generate coverage badge
        run: |
          mkdir -p /tmp/coverage-badge
          bash scripts/ci/coverage-badge.sh target/coverage/lcov.info /tmp/coverage-badge/coverage.svg

      - name: Publish coverage badge branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin coverage-badge || true
          if git show-ref --verify --quiet refs/remotes/origin/coverage-badge; then
            git checkout -B coverage-badge origin/coverage-badge
          else
            git checkout --orphan coverage-badge
            git rm -rf . || true
          fi

          mkdir -p badges
          cp /tmp/coverage-badge/coverage.svg badges/coverage.svg
          git add badges/coverage.svg

          if git diff --cached --quiet; then
            echo "Coverage badge unchanged."
            exit 0
          fi

          git commit -m "chore: update coverage badge"
          git push origin HEAD:coverage-badge
