name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      base_sha: ${{ steps.detect.outputs.base_sha }}
      docs_only: ${{ steps.detect.outputs.docs_only }}
      head_sha: ${{ steps.detect.outputs.head_sha }}
      release_branch: ${{ steps.detect.outputs.release_branch }}
      release_candidate: ${{ steps.detect.outputs.release_candidate }}
      release_only: ${{ steps.finalize.outputs.release_only }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect change set
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ -n "${PR_BASE_SHA}" ]; then
            base="${PR_BASE_SHA}"
            head="${PR_HEAD_SHA}"
          else
            base="${PUSH_BEFORE_SHA}"
            head="${EVENT_SHA}"
          fi
          # Any detection error falls back to "false" so the full Rust jobs run
          # rather than leaving the release-gated checks unresolved.
          docs_only="$(bash scripts/ci/detect-docs-only.sh --base "${base}" 2>/dev/null || true)"
          case "${docs_only}" in
            true|false) ;;
            *) docs_only=false ;;
          esac
          release_candidate=false
          policy_dir="${RUNNER_TEMP}/release-policy"
          mkdir -p "${policy_dir}"
          release_detector="${policy_dir}/detect-release-only.sh"
          release_gate="${policy_dir}/release-ci-gate.cjs"
          policy_available=false
          if git show "${base}:scripts/ci/detect-release-only.sh" >"${release_detector}" 2>/dev/null && \
             git show "${base}:.github/scripts/release-ci-gate.cjs" >"${release_gate}" 2>/dev/null; then
            policy_available=true
            echo "RELEASE_GATE_PATH=${release_gate}" >> "$GITHUB_ENV"
          else
            rm -f "${release_detector}" "${release_gate}"
          fi
          if [ "${EVENT_NAME}" = "pull_request" ] && \
             [ "${HEAD_REPOSITORY}" = "${REPOSITORY}" ] && \
             [ "${policy_available}" = "true" ] && \
             [ -n "${HEAD_REF}" ]; then
            release_candidate="$(
              bash "${release_detector}" \
                --base "${base}" \
                --head "${head}" \
                --branch "${HEAD_REF}" \
                2>/dev/null || true
            )"
          fi
          case "${release_candidate}" in
            true|false) ;;
            *) release_candidate=false ;;
          esac
          echo "base_sha=${base}" >> "$GITHUB_OUTPUT"
          echo "docs_only=${docs_only}" >> "$GITHUB_OUTPUT"
          echo "head_sha=${head}" >> "$GITHUB_OUTPUT"
          echo "release_branch=${HEAD_REF}" >> "$GITHUB_OUTPUT"
          echo "release_candidate=${release_candidate}" >> "$GITHUB_OUTPUT"
          echo "docs_only=${docs_only} release_candidate=${release_candidate} (base=${base}, head=${head})"

      - name: Prove full CI on exact base main commit
        id: base_ci
        if: steps.detect.outputs.release_candidate == 'true'
        uses: actions/github-script@v9
        env:
          BASE_SHA: ${{ steps.detect.outputs.base_sha }}
        with:
          script: |
            const { findTrustedMainCi } = require(process.env.RELEASE_GATE_PATH);
            try {
              const trusted = await findTrustedMainCi({
                github,
                context,
                sha: process.env.BASE_SHA,
              });
              core.setOutput("trusted", trusted ? "true" : "false");
              if (trusted) {
                core.info(`Reusing full base CI run ${trusted.runId}: ${trusted.runUrl}`);
              } else {
                core.info("Exact base commit has no unique successful full CI run; using full PR CI.");
              }
            } catch (error) {
              core.warning(`Could not prove full base CI; using full PR CI: ${error.message}`);
              core.setOutput("trusted", "false");
            }

      - name: Finalize fail-closed CI lane
        id: finalize
        env:
          BASE_CI_TRUSTED: ${{ steps.base_ci.outputs.trusted }}
          RELEASE_CANDIDATE: ${{ steps.detect.outputs.release_candidate }}
        run: |
          release_only=false
          if [ "${RELEASE_CANDIDATE}" = "true" ] && [ "${BASE_CI_TRUSTED}" = "true" ]; then
            release_only=true
          fi
          echo "release_only=${release_only}" >> "$GITHUB_OUTPUT"
          echo "release_only=${release_only}"

  cargo_deny:
    name: cargo-deny (advisories + bans)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Run cargo-deny (RUSTSEC advisories + duplicate-version bans)
        run: bash scripts/ci/cargo-deny-audit.sh

  test:
    needs: changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Set up Node.js
        if: needs.changes.outputs.release_only != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install zsh + xvfb + ripgrep + tmux + bubblewrap
        if: needs.changes.outputs.release_only != 'true'
        run: sudo apt-get update && sudo apt-get install -y zsh xvfb xauth ripgrep tmux bubblewrap

      - name: Install cargo-nextest
        if: needs.changes.outputs.release_only != 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Provision systemd user scopes
        if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.release_only != 'true'
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            # Ubuntu 24.04 denies capabilities inside unprivileged user namespaces
            # by default; this ephemeral runner must exercise bubblewrap itself.
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          uid="$(id -u)"
          sudo loginctl enable-linger "${USER}"
          sudo systemctl start "user@${uid}.service"
          echo "XDG_RUNTIME_DIR=/run/user/${uid}" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/${uid}/bus" >> "$GITHUB_ENV"
          test -S "/run/user/${uid}/systemd/private"

      - name: Require agent-session cgroup containment
        if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.release_only != 'true'
        env:
          AGENT_SESSION_TEST_REQUIRE_CGROUP: "1"
        run: |
          setsid --wait cargo test -p nils-agent-session --lib \
            tests::delete_kills_a_detached_descendant_inside_a_pinned_tmux_control_group \
            -- --exact --nocapture

      - name: Require provider-stop canary containment and lifecycle
        if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.release_only != 'true'
        env:
          AGENT_SESSION_TEST_REQUIRE_CGROUP: "1"
        run: |
          systemd-run --user --scope --quiet --collect \
            --unit "nils-provider-stop-canary-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-1" \
            -- cargo test -p nils-agent-session --test integration \
              provider_stop_canary -- --nocapture
          systemd-run --user --scope --quiet --collect \
            --unit "nils-provider-stop-canary-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-2" \
            -- cargo test -p nils-agent-session --test integration \
              coordination::main_agent_worker_start_emits_and_executes_exact_compiled_canary_supervisor \
              -- --exact --nocapture
          systemd-run --user --scope --quiet --collect \
            --unit "nils-provider-stop-canary-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-3" \
            -- cargo test -p nils-agent-session --lib \
              tests::provider_stop_canary_namespace_setup_irrevocably_drops_privileges \
              -- --exact --nocapture
          systemd-run --user --scope --quiet --collect \
            --unit "nils-provider-stop-canary-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-4" \
            -- cargo test -p nils-agent-session --lib \
              tests::provider_stop_canary_never_signals_an_injected_same_uid_cgroup_member \
              -- --exact --nocapture

      - name: Nils CLI checks (includes third-party-artifacts-audit, completion audits, docs-hygiene-audit, tempdir-leak-audit, test-stale-audit)
        env:
          NILS_CLI_TEST_RUNNER: nextest
        run: |
          if [ "${{ needs.changes.outputs.docs_only }}" = "true" ]; then
            bash scripts/ci/nils-cli-checks-entrypoint.sh --docs-only
          elif [ "${{ needs.changes.outputs.release_only }}" = "true" ]; then
            policy_dir="${RUNNER_TEMP}/release-policy"
            mkdir -p "${policy_dir}"
            git show "${{ needs.changes.outputs.base_sha }}:scripts/ci/detect-release-only.sh" \
              >"${policy_dir}/detect-release-only.sh"
            git show "${{ needs.changes.outputs.base_sha }}:scripts/ci/release-only-checks.sh" \
              >"${policy_dir}/release-only-checks.sh"
            bash "${policy_dir}/release-only-checks.sh" \
              --base "${{ needs.changes.outputs.base_sha }}" \
              --head "${{ needs.changes.outputs.head_sha }}" \
              --branch "${{ needs.changes.outputs.release_branch }}"
          else
            bash scripts/ci/nils-cli-checks-entrypoint.sh --xvfb
          fi

      - name: Full validation marker
        if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.release_only != 'true'
        run: true

      - name: Publish JUnit report
        if: always() && hashFiles('target/nextest/ci/junit.xml') != ''
        uses: mikepenz/action-junit-report@v6
        with:
          token: ${{ github.token }}
          check_name: JUnit Test Report
          report_paths: target/nextest/ci/junit.xml
          detailed_summary: true
          group_suite: true
          include_passed: true

      - name: Upload JUnit XML
        if: always() && hashFiles('target/nextest/ci/junit.xml') != ''
        uses: actions/upload-artifact@v7
        with:
          name: junit-nextest
          path: target/nextest/ci/junit.xml

  test_macos:
    needs: changes
    runs-on: macos-14
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Set up Node.js
        if: needs.changes.outputs.release_only != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install bash + ripgrep
        if: needs.changes.outputs.release_only != 'true'
        run: |
          if ! /opt/homebrew/bin/bash --version >/dev/null 2>&1; then
            brew install bash
          fi
          if ! command -v rg >/dev/null 2>&1; then
            brew install ripgrep
          fi

      - name: Install cargo-nextest
        if: needs.changes.outputs.release_only != 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Nils CLI checks (includes third-party-artifacts-audit, completion audits, docs-hygiene-audit, tempdir-leak-audit, test-stale-audit)
        env:
          NILS_CLI_TEST_RUNNER: nextest
        run: |
          if [ "${{ needs.changes.outputs.docs_only }}" = "true" ]; then
            /opt/homebrew/bin/bash scripts/ci/nils-cli-checks-entrypoint.sh --docs-only
          elif [ "${{ needs.changes.outputs.release_only }}" = "true" ]; then
            policy_dir="${RUNNER_TEMP}/release-policy"
            mkdir -p "${policy_dir}"
            git show "${{ needs.changes.outputs.base_sha }}:scripts/ci/detect-release-only.sh" \
              >"${policy_dir}/detect-release-only.sh"
            git show "${{ needs.changes.outputs.base_sha }}:scripts/ci/release-only-checks.sh" \
              >"${policy_dir}/release-only-checks.sh"
            bash "${policy_dir}/release-only-checks.sh" \
              --base "${{ needs.changes.outputs.base_sha }}" \
              --head "${{ needs.changes.outputs.head_sha }}" \
              --branch "${{ needs.changes.outputs.release_branch }}"
          else
            /opt/homebrew/bin/bash scripts/ci/nils-cli-checks-entrypoint.sh
          fi

      - name: Full validation marker
        if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.release_only != 'true'
        run: true

      - name: Publish JUnit report
        if: always() && hashFiles('target/nextest/ci/junit.xml') != ''
        uses: mikepenz/action-junit-report@v6
        with:
          token: ${{ github.token }}
          check_name: JUnit Test Report (macOS)
          report_paths: target/nextest/ci/junit.xml
          detailed_summary: true
          group_suite: true
          include_passed: true

      - name: Upload JUnit XML
        if: always() && hashFiles('target/nextest/ci/junit.xml') != ''
        uses: actions/upload-artifact@v7
        with:
          name: junit-nextest-macos
          path: target/nextest/ci/junit.xml

  coverage:
    needs: changes
    runs-on: macos-14
    permissions:
      contents: read
      pull-requests: write
    env:
      # Temporary floor from native run 30743840826 (84.10%). After the runtime-kit
      # delivery, restore 85 once native full-workspace coverage reaches at least 85%.
      COVERAGE_FAIL_UNDER_LINES: "84"
    steps:
      # Docs-only and proven release-only change sets skip coverage work at the
      # step level so the required `coverage` job still concludes `success`.
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.release_only != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache cargo
        if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.release_only != 'true'
        uses: Swatinem/rust-cache@v2

      - name: Install cargo tools
        if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.release_only != 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: |
            cargo-llvm-cov
            cargo-nextest

      - name: Clear previous coverage outputs
        if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.release_only != 'true'
        run: rm -rf target/coverage && mkdir -p target/coverage

      - name: Generate LCOV report
        if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.release_only != 'true'
        # Preserve the full native failure inventory instead of stopping at the first failing test.
        run: cargo llvm-cov nextest --profile ci --workspace --no-fail-fast --lcov --output-path target/coverage/lcov.info --fail-under-lines "$COVERAGE_FAIL_UNDER_LINES"

      - name: Generate HTML report
        if: always() && needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.release_only != 'true' && hashFiles('target/coverage/lcov.info') != ''
        run: cargo llvm-cov report --html --output-dir target/coverage

      - name: Run doctests (not included in coverage)
        if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.release_only != 'true'
        run: cargo test --workspace --doc

      - name: Full validation marker
        if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.release_only != 'true'
        run: true

      - name: Coverage summary
        if: always() && needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.release_only != 'true'
        run: |
          env GITHUB_STEP_SUMMARY=/dev/stdout bash scripts/ci/coverage-summary.sh target/coverage/lcov.info \
            | tee target/coverage/coverage-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: PR comment (sticky coverage summary)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false && needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.release_only != 'true' && hashFiles('target/coverage/lcov.info') != ''
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: coverage
          path: target/coverage/coverage-summary.md

      - name: Upload coverage LCOV
        if: always() && needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.release_only != 'true' && hashFiles('target/coverage/lcov.info') != ''
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: target/coverage/lcov.info
          retention-days: 7

      - name: Upload coverage HTML
        if: always() && needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.release_only != 'true' && hashFiles('target/coverage/html/index.html') != ''
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: target/coverage/html
          retention-days: 7

      - name: Cleanup coverage outputs (avoid bloating cache)
        if: always() && needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.release_only != 'true'
        run: rm -rf target/coverage

  coverage_badge:
    if: github.event_name == 'push' && needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.release_only != 'true'
    runs-on: ubuntu-latest
    needs:
      - changes
      - coverage
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download coverage LCOV
        uses: actions/download-artifact@v8
        with:
          name: coverage-lcov
          path: target/coverage

      - name: Generate coverage badge
        run: |
          mkdir -p /tmp/coverage-badge
          bash scripts/ci/coverage-badge.sh target/coverage/lcov.info /tmp/coverage-badge/coverage.svg

      - name: Publish coverage badge branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin coverage-badge || true
          if git show-ref --verify --quiet refs/remotes/origin/coverage-badge; then
            git checkout -B coverage-badge origin/coverage-badge
          else
            git checkout --orphan coverage-badge
            git rm -rf . || true
          fi

          mkdir -p badges
          cp /tmp/coverage-badge/coverage.svg badges/coverage.svg
          git add badges/coverage.svg

          if git diff --cached --quiet; then
            echo "Coverage badge unchanged."
            exit 0
          fi

          git commit -m "chore: update coverage badge"
          git push origin HEAD:coverage-badge
