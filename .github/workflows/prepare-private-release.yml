name: Prepare private release
run-name: prepare nils-cli v${{ inputs.version }} (${{ inputs.request_id }})

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Stable nils-cli SemVer, without leading v"
        required: true
        type: string
      request_id:
        description: "Private orchestrator correlation UUID"
        required: true
        type: string

concurrency:
  group: prepare-private-release-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout the dispatched main commit
        # actions/checkout v7
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate request
        env:
          VERSION: ${{ inputs.version }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+[.][0-9]+[.][0-9]+$ ]] || {
            echo "version must be stable SemVer in X.Y.Z form" >&2
            exit 1
          }
          [[ "$REQUEST_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]] || {
            echo "request_id must be a lowercase UUIDv4" >&2
            exit 1
          }

      - name: Prepare and validate the canonical release patch
        env:
          VERSION: ${{ inputs.version }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          set -euo pipefail
          base_sha="$GITHUB_SHA"

          cargo build --locked -p nils-semantic-commit -p nils-git-scope
          export PATH="$PWD/target/debug:$PATH"
          git config user.name "release-preparation[bot]"
          git config user.email "release-preparation[bot]@users.noreply.github.com"
          git config commit.gpgsign false

          bash .agents/scripts/release.sh \
            --version "$VERSION" \
            --skip-push \
            --skip-local-brew-upgrade \
            --skip-dev-clean

          test "$(git rev-list --count "$base_sha..HEAD")" = 1
          test "$(git show -s --format=%s HEAD)" = "chore(release): bump cli versions to $VERSION"

          mkdir -p release-preparation
          git diff --binary "$base_sha..HEAD" >release-preparation/release.patch
          test -s release-preparation/release.patch
          patch_sha256="$(sha256sum release-preparation/release.patch | awk '{print $1}')"
          {
            printf 'version=%s\n' "$VERSION"
            printf 'request_id=%s\n' "$REQUEST_ID"
            printf 'base_sha=%s\n' "$base_sha"
            printf 'patch_sha256=%s\n' "$patch_sha256"
          } >release-preparation/manifest.env

      - name: Upload the release preparation
        # actions/upload-artifact v7
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nils-cli-release-${{ inputs.request_id }}
          path: release-preparation/
          if-no-files-found: error
          retention-days: 1
