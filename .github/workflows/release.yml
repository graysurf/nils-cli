name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  verify_ci:
    name: Verify CI gate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Checkout release gate
        uses: actions/checkout@v7

      - name: Authorize release invocation
        shell: bash
        env:
          RELEASE_ACTOR: ${{ github.actor }}
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_RUN_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          bash .github/scripts/validate-release-invocation.sh \
            "${RELEASE_EVENT}" \
            "${RELEASE_ACTOR}" \
            "${RELEASE_TRIGGERING_ACTOR}" \
            "${RELEASE_RUN_ATTEMPT}" \
            "${GITHUB_REF}"

      - name: Require green CI on tagged commit
        uses: actions/github-script@v9
        with:
          script: |
            const { runReleaseGate } = require("./.github/scripts/release-ci-gate.cjs");
            await runReleaseGate({ github, context, core });

  build:
    name: Build (${{ matrix.target }})
    needs: verify_ci
    runs-on: ${{ matrix.runs_on }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs_on: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runs_on: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runs_on: macos-14
            target: x86_64-apple-darwin
          - runs_on: macos-14
            target: aarch64-apple-darwin
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install ripgrep
        shell: bash
        run: |
          set -euo pipefail
          if command -v rg >/dev/null 2>&1; then
            rg --version
            exit 0
          fi

          case "${RUNNER_OS}" in
            Linux)
              sudo apt-get update
              sudo apt-get install -y ripgrep
              ;;
            macOS)
              brew install ripgrep
              ;;
            *)
              echo "error: unsupported RUNNER_OS for ripgrep install: ${RUNNER_OS}" >&2
              exit 1
              ;;
          esac

          rg --version

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Regenerate third-party artifacts
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/generate-third-party-artifacts.sh --write
          bash scripts/generate-third-party-artifacts.sh --check

      - name: Build (release)
        run: cargo build --release --workspace --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          target="${{ matrix.target }}"

          out_dir="dist/nils-cli-${tag}-${target}"
          mkdir -p "${out_dir}/bin"

          bins=()
          while IFS= read -r bin; do
            [[ -n "${bin}" ]] || continue
            bins+=( "${bin}" )
          done < <(bash scripts/workspace-bins.sh --release-default)

          if [[ ${#bins[@]} -eq 0 ]]; then
            echo "error: no workspace binaries found" >&2
            exit 1
          fi

          for bin in "${bins[@]}"; do
            src="target/${target}/release/${bin}"
            if [[ ! -f "${src}" ]]; then
              echo "error: missing binary: ${src}" >&2
              exit 1
            fi
            install -m 0755 "${src}" "${out_dir}/bin/${bin}"
          done

          cp -R completions "${out_dir}/"
          cp README.md LICENSE THIRD_PARTY_LICENSES.md THIRD_PARTY_NOTICES.md "${out_dir}/"

          tarball="dist/nils-cli-${tag}-${target}.tar.gz"
          tar -C dist -czf "${tarball}" "nils-cli-${tag}-${target}"

          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${tarball}" > "${tarball}.sha256"
          elif command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "${tarball}" > "${tarball}.sha256"
          else
            echo "error: sha256sum/shasum not found" >&2
            exit 1
          fi

      - name: Audit release tarball third-party artifacts
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci/release-tarball-third-party-audit.sh \
            --target "${{ matrix.target }}" \
            --tag "${{ github.ref_name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: nils-cli-${{ matrix.target }}
          if-no-files-found: error
          path: |
            dist/nils-cli-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
            dist/nils-cli-${{ github.ref_name }}-${{ matrix.target }}.tar.gz.sha256

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/**/*.tar.gz*

  dispatch_homebrew_tap:
    name: Dispatch Homebrew tap update
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: read
    steps:
      - name: Dispatch formula update
        uses: actions/github-script@v9
        env:
          HOMEBREW_TAP_DISPATCH_TOKEN: ${{ secrets.HOMEBREW_TAP_DISPATCH_TOKEN }}
        with:
          script: |
            const token = process.env.HOMEBREW_TAP_DISPATCH_TOKEN;
            if (!token) {
              core.setFailed("Missing HOMEBREW_TAP_DISPATCH_TOKEN secret; cannot dispatch sympoies/homebrew-tap.");
              return;
            }

            const tag = context.ref.replace("refs/tags/", "");
            const version = tag.replace(/^v/, "");
            const sourceRepo = `${context.repo.owner}/${context.repo.repo}`;
            const releaseUrl = `https://github.com/${sourceRepo}/releases/tag/${tag}`;

            const response = await fetch("https://api.github.com/repos/sympoies/homebrew-tap/dispatches", {
              method: "POST",
              headers: {
                "Accept": "application/vnd.github+json",
                "Authorization": `Bearer ${token}`,
                "X-GitHub-Api-Version": "2022-11-28",
              },
              body: JSON.stringify({
                event_type: "nils-cli-release",
                client_payload: {
                  formula: "nils-cli",
                  source_repo: sourceRepo,
                  version,
                  tag,
                  release_url: releaseUrl,
                },
              }),
            });

            if (!response.ok) {
              const body = await response.text();
              core.setFailed(`Failed to dispatch sympoies/homebrew-tap: HTTP ${response.status} ${body}`);
              return;
            }
            core.info(`Dispatched sympoies/homebrew-tap nils-cli formula update for ${tag}.`);

            // The dispatches endpoint answers 204 whether or not any workflow
            // starts, so the 204 above proves only that we sent something. A
            // token GitHub resolves to an Actions identity, for one, is accepted
            // here and creates no run at all. Confirm a run exists before this
            // job — the last step of the release — reports success.
            //
            // The tap is public, so this job's own token can read its runs; fall
            // back to the dispatch token if that read is ever refused.
            const runsUrl =
              "https://api.github.com/repos/sympoies/homebrew-tap/actions/workflows/" +
              "update-nils-cli-formula.yml/runs?event=repository_dispatch&per_page=20";

            const listRuns = async () => {
              try {
                const { data } = await github.rest.actions.listWorkflowRuns({
                  owner: "sympoies",
                  repo: "homebrew-tap",
                  workflow_id: "update-nils-cli-formula.yml",
                  event: "repository_dispatch",
                  per_page: 20,
                });
                return { runs: data.workflow_runs || [] };
              } catch (defaultTokenError) {
                const fallback = await fetch(runsUrl, {
                  headers: {
                    "Accept": "application/vnd.github+json",
                    "Authorization": `Bearer ${token}`,
                    "X-GitHub-Api-Version": "2022-11-28",
                  },
                });
                if (fallback.ok) {
                  return { runs: (await fallback.json()).workflow_runs || [] };
                }
                return {
                  error:
                    `default token: ${defaultTokenError.status || defaultTokenError.message}; ` +
                    `HOMEBREW_TAP_DISPATCH_TOKEN: HTTP ${fallback.status}`,
                };
              }
            };

            // Tolerate clock skew between this runner and the API.
            const notBefore = Date.now() - 120_000;
            const deadline = Date.now() + 180_000;
            let created = null;
            let readError = null;

            while (Date.now() < deadline) {
              const { runs, error } = await listRuns();
              if (error) {
                readError = error;
                break;
              }
              created = runs.find((run) => Date.parse(run.created_at) >= notBefore);
              if (created) break;
              await new Promise((resolve) => setTimeout(resolve, 10_000));
            }

            if (readError) {
              core.setFailed(
                `Dispatched sympoies/homebrew-tap for ${tag} but could not read its workflow runs ` +
                `(${readError}), so delivery is unproven. Grant the token read access to Actions on ` +
                `the tap, or verify the formula update by hand before treating this release as done.`,
              );
              return;
            }

            if (!created) {
              core.setFailed(
                `Dispatched sympoies/homebrew-tap for ${tag} and got HTTP 204, but no ` +
                `repository_dispatch run of update-nils-cli-formula.yml appeared within 180s. ` +
                `The formula was NOT updated. HOMEBREW_TAP_DISPATCH_TOKEN is the thing to check ` +
                `first: GitHub accepts the dispatch but starts no run when the token resolves to ` +
                `an Actions identity. Recover with: gh workflow run update-nils-cli-formula.yml ` +
                `--repo sympoies/homebrew-tap -f version=${version} -f source_repo=${sourceRepo} ` +
                `-f expected_workflow_sha=<tap main sha>`,
              );
              return;
            }

            core.info(`Confirmed tap run ${created.id} for ${tag}: ${created.html_url}`);
