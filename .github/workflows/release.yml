name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  verify_ci:
    name: Verify CI gate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      checks: read
      contents: read
    steps:
      - name: Require green CI on tagged commit
        uses: actions/github-script@v9
        with:
          script: |
            const requiredChecks = ["test", "test_macos", "coverage"];
            const attempts = 60;
            const intervalMs = 30_000;
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
            const timestamp = (run) =>
              Date.parse(run.completed_at || run.started_at || run.check_suite?.created_at || "") || 0;

            for (let attempt = 1; attempt <= attempts; attempt++) {
              const runs = await github.paginate(github.rest.checks.listForRef, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: context.sha,
                per_page: 100,
              });

              const latest = new Map();
              for (const run of runs) {
                if (!requiredChecks.includes(run.name)) {
                  continue;
                }
                const previous = latest.get(run.name);
                if (!previous || timestamp(run) > timestamp(previous)) {
                  latest.set(run.name, run);
                }
              }

              const pending = [];
              const failing = [];
              for (const name of requiredChecks) {
                const run = latest.get(name);
                if (!run) {
                  pending.push(`${name}: missing`);
                } else if (run.status !== "completed") {
                  pending.push(`${name}: ${run.status}`);
                } else if (run.conclusion !== "success") {
                  failing.push(`${name}: ${run.conclusion} (${run.html_url})`);
                }
              }

              if (pending.length === 0 && failing.length === 0) {
                core.info(`Tagged commit ${context.sha} has green CI checks: ${requiredChecks.join(", ")}`);
                return;
              }

              if (failing.length > 0) {
                core.setFailed(`Tagged commit ${context.sha} has failed CI checks: ${failing.join("; ")}`);
                return;
              }

              if (attempt === attempts) {
                core.setFailed(`Timed out waiting for CI checks on ${context.sha}: ${pending.join("; ")}`);
                return;
              }

              core.info(`Waiting for CI checks on ${context.sha} (${attempt}/${attempts}): ${pending.join("; ")}`);
              await sleep(intervalMs);
            }

  build:
    name: Build (${{ matrix.target }})
    needs: verify_ci
    runs-on: ${{ matrix.runs_on }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs_on: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runs_on: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - runs_on: macos-14
            target: x86_64-apple-darwin
          - runs_on: macos-14
            target: aarch64-apple-darwin
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install ripgrep
        shell: bash
        run: |
          set -euo pipefail
          if command -v rg >/dev/null 2>&1; then
            rg --version
            exit 0
          fi

          case "${RUNNER_OS}" in
            Linux)
              sudo apt-get update
              sudo apt-get install -y ripgrep
              ;;
            macOS)
              brew install ripgrep
              ;;
            *)
              echo "error: unsupported RUNNER_OS for ripgrep install: ${RUNNER_OS}" >&2
              exit 1
              ;;
          esac

          rg --version

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Regenerate third-party artifacts
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/generate-third-party-artifacts.sh --write
          bash scripts/generate-third-party-artifacts.sh --check

      - name: Install cross
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build (release)
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        run: cargo build --release --workspace --locked --target ${{ matrix.target }}

      - name: Build (release, cross)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cross build --release --workspace --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          target="${{ matrix.target }}"

          out_dir="dist/nils-cli-${tag}-${target}"
          mkdir -p "${out_dir}/bin"

          bins=()
          while IFS= read -r bin; do
            [[ -n "${bin}" ]] || continue
            bins+=( "${bin}" )
          done < <(bash scripts/workspace-bins.sh --release-default)

          if [[ ${#bins[@]} -eq 0 ]]; then
            echo "error: no workspace binaries found" >&2
            exit 1
          fi

          for bin in "${bins[@]}"; do
            src="target/${target}/release/${bin}"
            if [[ ! -f "${src}" ]]; then
              echo "error: missing binary: ${src}" >&2
              exit 1
            fi
            install -m 0755 "${src}" "${out_dir}/bin/${bin}"
          done

          cp -R completions "${out_dir}/"
          cp README.md LICENSE THIRD_PARTY_LICENSES.md THIRD_PARTY_NOTICES.md "${out_dir}/"

          tarball="dist/nils-cli-${tag}-${target}.tar.gz"
          tar -C dist -czf "${tarball}" "nils-cli-${tag}-${target}"

          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${tarball}" > "${tarball}.sha256"
          elif command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "${tarball}" > "${tarball}.sha256"
          else
            echo "error: sha256sum/shasum not found" >&2
            exit 1
          fi

      - name: Audit release tarball third-party artifacts
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci/release-tarball-third-party-audit.sh \
            --target "${{ matrix.target }}" \
            --tag "${{ github.ref_name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: nils-cli-${{ matrix.target }}
          if-no-files-found: error
          path: |
            dist/nils-cli-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
            dist/nils-cli-${{ github.ref_name }}-${{ matrix.target }}.tar.gz.sha256

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/**/*.tar.gz*

  dispatch_homebrew_tap:
    name: Dispatch Homebrew tap update
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: read
    steps:
      - name: Dispatch formula update
        uses: actions/github-script@v9
        env:
          HOMEBREW_TAP_DISPATCH_TOKEN: ${{ secrets.HOMEBREW_TAP_DISPATCH_TOKEN }}
        with:
          script: |
            const token = process.env.HOMEBREW_TAP_DISPATCH_TOKEN;
            if (!token) {
              core.setFailed("Missing HOMEBREW_TAP_DISPATCH_TOKEN secret; cannot dispatch sympoies/homebrew-tap.");
              return;
            }

            const tag = context.ref.replace("refs/tags/", "");
            const version = tag.replace(/^v/, "");
            const sourceRepo = `${context.repo.owner}/${context.repo.repo}`;
            const releaseUrl = `https://github.com/${sourceRepo}/releases/tag/${tag}`;

            const response = await fetch("https://api.github.com/repos/sympoies/homebrew-tap/dispatches", {
              method: "POST",
              headers: {
                "Accept": "application/vnd.github+json",
                "Authorization": `Bearer ${token}`,
                "X-GitHub-Api-Version": "2022-11-28",
              },
              body: JSON.stringify({
                event_type: "nils-cli-release",
                client_payload: {
                  formula: "nils-cli",
                  source_repo: sourceRepo,
                  version,
                  tag,
                  release_url: releaseUrl,
                },
              }),
            });

            if (!response.ok) {
              const body = await response.text();
              core.setFailed(`Failed to dispatch sympoies/homebrew-tap: HTTP ${response.status} ${body}`);
              return;
            }
            core.info(`Dispatched sympoies/homebrew-tap nils-cli formula update for ${tag}.`);
