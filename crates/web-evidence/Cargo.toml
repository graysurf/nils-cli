[package]
name = "nils-web-evidence"
version = "0.8.6"
edition.workspace = true
license.workspace = true

description = "CLI crate for nils-web-evidence in the nils-cli workspace."
repository = "https://github.com/sympoies/nils-cli"

[lib]
name = "web_evidence"
path = "src/lib.rs"

[[bin]]
name = "web-evidence"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
clap_complete = { workspace = true }
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
nils-test-support = { version = "0.8.6", path = "../nils-test-support" }
pretty_assertions = { workspace = true }
tempfile = "3"
