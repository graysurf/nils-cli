[package]
name = "nils-web-evidence"
version = "1.20.8"
edition.workspace = true
license.workspace = true

description = "CLI crate for nils-web-evidence in the nils-cli workspace."
repository = "https://github.com/sympoies/nils-cli"

[lib]
name = "web_evidence"
path = "src/lib.rs"

[[bin]]
name = "web-evidence"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
clap_complete = { workspace = true }
nils-build-info = { version = "1.20.8", path = "../nils-build-info" }
nils-common = { version = "1.20.8", path = "../nils-common", package = "nils-common" }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
nils-test-support = { version = "1.20.8", path = "../nils-test-support" }
pretty_assertions = { workspace = true }
tempfile = "3"
