[package]
name = "nils-plan-issue"
version = "1.0.4"
edition.workspace = true
license.workspace = true
default-run = "plan-issue"

description = "CLI crate for nils-plan-issue in the nils-cli workspace."
repository = "https://github.com/sympoies/nils-cli"

[lib]
name = "plan_issue"
path = "src/lib.rs"

[[bin]]
name = "plan-issue"
path = "src/main.rs"

[[bin]]
name = "plan-issue-local"
path = "src/bin/plan-issue-local.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { workspace = true }
clap_complete = { workspace = true }
nils-build-info = { version = "1.0.4", path = "../nils-build-info" }
serde = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order"] }
nils-common = { version = "1.0.4", path = "../nils-common", package = "nils-common" }
nils-markdown = { version = "1.0.4", path = "../nils-markdown", package = "nils-markdown" }
plan-tooling = { version = "1.0.4", path = "../plan-tooling", package = "nils-plan-tooling" }

[dev-dependencies]
nils-markdown = { version = "1.0.4", path = "../nils-markdown", package = "nils-markdown", features = ["test-support"] }
nils-test-support = { version = "1.0.4", path = "../nils-test-support" }
pretty_assertions = { workspace = true }
tempfile = "3"
