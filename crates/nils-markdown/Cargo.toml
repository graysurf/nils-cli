[package]
name = "nils-markdown"
version = "0.23.0"
edition.workspace = true
license.workspace = true
description = "Shared Tera-backed Markdown template layer for the nils-cli workspace."
repository = "https://github.com/sympoies/nils-cli"

[lib]
name = "nils_markdown"
path = "src/lib.rs"

# `[[bin]]` for `md-render` is added in Sprint 3 Task 3.1. Sprint 1
# only declares the `bin-cli` feature so the manifest dependency
# wiring is final; the binary main + manifest target arrive together
# with the implementation in Sprint 3.

[features]
bin-cli = ["dep:anyhow", "dep:clap"]
# Enables the `golden::assert_render` byte-equality harness for
# consumer dev-dependencies (Tier A migration golden tests).
test-support = ["dep:pretty_assertions"]

[dependencies]
anyhow = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
indexmap = { workspace = true }
nils-common = { version = "0.23.0", path = "../nils-common", package = "nils-common" }
pretty_assertions = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
tera = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
nils-markdown = { path = ".", features = ["test-support"] }
nils-test-support = { version = "0.23.0", path = "../nils-test-support" }
tempfile = "3"
