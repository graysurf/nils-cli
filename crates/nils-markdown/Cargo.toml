[package]
name = "nils-markdown"
version = "1.25.10"
edition.workspace = true
license.workspace = true
description = "Shared minijinja-backed Markdown template layer for the nils-cli workspace."
repository = "https://github.com/sympoies/nils-cli"

[lib]
name = "nils_markdown"
path = "src/lib.rs"

[[bin]]
name = "md-render"
path = "src/bin/md-render/main.rs"
required-features = ["bin-cli"]

[[test]]
name = "golden_smoke"
path = "tests/golden_smoke.rs"
required-features = ["test-support"]

[[test]]
name = "md_render_bin"
path = "tests/md_render_bin.rs"
required-features = ["bin-cli"]

[features]
bin-cli = ["dep:anyhow", "dep:clap", "dep:clap_complete", "dep:nils-build-info"]
# Enables the `golden::assert_render` byte-equality harness for
# consumer dev-dependencies (Tier A migration golden tests).
test-support = ["dep:pretty_assertions"]

[dependencies]
anyhow = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
clap_complete = { workspace = true, optional = true }
minijinja = { workspace = true }
nils-build-info = { version = "1.25.10", path = "../nils-build-info", optional = true }
nils-common = { version = "1.25.10", path = "../nils-common", package = "nils-common" }
pretty_assertions = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
nils-test-support = { version = "1.25.10", path = "../nils-test-support" }
tempfile = "3"
