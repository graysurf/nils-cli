[package]
name = "nils-markdown"
version = "0.24.1"
edition.workspace = true
license.workspace = true
description = "Shared Tera-backed Markdown template layer for the nils-cli workspace."
repository = "https://github.com/sympoies/nils-cli"

[lib]
name = "nils_markdown"
path = "src/lib.rs"

[[bin]]
name = "md-render"
path = "src/bin/md-render/main.rs"
required-features = ["bin-cli"]

[features]
bin-cli = ["dep:anyhow", "dep:clap", "dep:clap_complete"]
# Enables the `golden::assert_render` byte-equality harness for
# consumer dev-dependencies (Tier A migration golden tests).
test-support = ["dep:pretty_assertions"]

[dependencies]
anyhow = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
clap_complete = { workspace = true, optional = true }
indexmap = { workspace = true }
nils-common = { version = "0.24.1", path = "../nils-common", package = "nils-common" }
pretty_assertions = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
tera = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
nils-markdown = { version = "0.24.1", path = ".", features = ["bin-cli", "test-support"] }
nils-test-support = { version = "0.24.1", path = "../nils-test-support" }
tempfile = "3"
