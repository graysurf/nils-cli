[package]
name = "nils-forge-cli"
version = "1.12.0"
edition.workspace = true
license.workspace = true

description = "Provider-neutral forge CLI (gh / glab wrapper) for the nils-cli workspace."
repository = "https://github.com/sympoies/nils-cli"

[lib]
name = "forge_cli"
path = "src/lib.rs"

[[bin]]
name = "forge-cli"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
clap_complete = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["std"] }
nils-build-info = { version = "1.12.0", path = "../nils-build-info" }
libc = "0.2"
nils-common = { version = "1.12.0", path = "../nils-common", package = "nils-common" }
agent-workflow-primitives = { version = "1.12.0", path = "../agent-workflow-primitives", package = "nils-agent-workflow-primitives" }
serde = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order"] }
serde_yaml_ng = { workspace = true }
tempfile = "3"
thiserror = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
nils-test-support = { version = "1.12.0", path = "../nils-test-support" }
pretty_assertions = { workspace = true }
