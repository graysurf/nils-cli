# forge-cli operation catalog v1.
#
# Machine-readable companion to `forge-cli-spec-v1.md`. The spec is
# the source of truth for prose, rationale, and contract conformance;
# this file enumerates every atom + macro for the v1 surface so the
# Rust implementation, the backend wrappers, and the test fixtures
# can be generated from a single declaration.
#
# Validation rule names referenced from `validations:` are defined
# at the top of the file under `validations_catalog`. The spec
# describes their semantics; the names below are the keys an
# implementation can match on.

version: 1
binary: forge-cli
schema_prefix: cli.forge-cli

# ---------------------------------------------------------------------------
# Shared validation catalog. Each op picks the subset it enforces.
# ---------------------------------------------------------------------------
validations_catalog:
  branch_name:
    rule: "^(feat|fix)/[a-z0-9][a-z0-9-]{1,63}$"
    error_kind: branch_name_invalid
    exit: DATA
  branch_kind_matches:
    rule: "feature -> feat/*, bug -> fix/*"
    error_kind: branch_kind_mismatch
    exit: DATA
  body_summary:
    rule: "non-empty H2 `## Summary` section"
    error_kind: body_missing_summary
    exit: DATA
  body_test_plan:
    rule: "non-empty H2 `## Test plan` section"
    error_kind: body_missing_test_plan
    exit: DATA
  title_length:
    rule: "len(title) <= 70 and no trailing whitespace"
    error_kind: title_too_long
    exit: DATA
  no_local_path:
    rule: "posted title/body/comment text must not embed a machine-local home path (/Users/<owner>/... or /home/<owner>/...); diagnostics name the source and line with a $HOME-relative fix without echoing the original path; allowlist /home/agent, /home/linuxbrew, /home/runner; bypass with FORGE_CLI_ALLOW_LOCAL_PATH=1"
    error_kind: local_path_present
    exit: DATA
  no_agent_attribution:
    rule: "posted title/body/comment text must not carry agent self-attribution: a generator marker (Generated with ... prose, claude.com/claude-code or claude.ai/code link) or a Co-Authored-By trailer naming the model family or noreply@anthropic.com; fenced blocks and inline code spans are stripped first so documenting the rule is allowed; forms shared with semantic-commit's claude-coauthor-trailer / claude-generated-marker rules; bypass with FORGE_CLI_ALLOW_AGENT_ATTRIBUTION=1"
    error_kind: agent_attribution_present
    exit: DATA
  worktree_clean:
    rule: "git status --porcelain is empty"
    error_kind: dirty_worktree
    exit: DATA
  head_pushed:
    rule: "resolved head branch has upstream and matches remote-tracking ref"
    error_kind: head_not_pushed
    exit: DATA
  qualified_github_head:
    rule: "GitHub-only <user>:<branch> heads validate only a non-empty single-qualifier structure locally and delegate username grammar/account type to GitHub; they require one local upstream push repository on the selected GitHub authority whose owner equals <user>; post-create/adopt provider headRefName, headRefOid, and headRepository must equal the local branch, commit, and upstream repository; gh pr list lookup never receives the unsupported qualified syntax and a saturated bounded result without the exact repository+branch fails closed; GitHub CLI does not support organization qualifiers"
    error_kind: qualified_head_upstream_mismatch | qualified_head_provider_mismatch
    exit: DATA
  default_branch_protected:
    rule: "refuse caller-controlled force-push / direct merge to repo default branch; governed repo.push-default permits only one verified fast-forward commit with an exact-old-OID compare-and-swap"
    error_kind: default_branch_protected
    exit: DATA
  direct_default_delivery:
    rule: "one actual push destination whose canonical authority exactly matches the selected authority before provider metadata lookup, with non-default HTTPS ports retained; provider metadata must match that same authority and slug; no second-stage URL rewrite; clean non-default checkout; exact remote base; one locally verified signed commit; regular bounded reason file; bounded provider/Git subprocesses; expected-old-OID compare-and-swap fast-forward with inherited push expansion disabled; exact remote read-back"
    error_kind: push_destination_missing | push_destination_ambiguous | push_destination_credentials_unsupported | push_destination_rewrite_ambiguous | provider_mismatch | provider_unsupported | repository_mismatch | dirty_worktree | detached_head | default_branch_checkout | head_not_checked_out | expected_base_mismatch | expected_base_missing | expected_base_not_ancestor | direct_commit_count_invalid | commit_signature_unverified | reason_file_unreadable | reason_invalid | local_path_present | object_id_invalid | remote_default_lookup_failed | remote_default_branch_missing | git_timeout | git_output_limit | backend_timeout | backend_output_limit | default_push_rejected | default_push_verification_failed | software_error
    exit: DATA | RUNTIME | UNAVAILABLE | SOFTWARE | USAGE
  draft_merge_refused:
    rule: "pr.draft == false at merge time"
    error_kind: draft_merge_refused
    exit: DATA
  required_checks_green:
    rule: "every required check is success at merge time, and at least one check was reported"
    error_kind: checks_pending     # exit DATA when pending
    failed_error_kind: checks_failed  # exit RUNTIME when failed
    absent_error_kind: checks_not_registered  # exit DATA when no required checks AND no visible rows; bypass with --allow-no-checks (+ --allow-no-checks-reason)
  merge_method_supported:
    rule: "method in {squash, merge, rebase} and backend supports it"
    error_kind: merge_method_unsupported
    exit: DATA
  keep_branch_conflict:
    rule: "--keep-branch and --delete-branch are mutually exclusive"
    error_kind: keep_branch_conflict
    exit: DATA
  review_threads_resolved:
    rule: "no non-outdated unresolved review threads at merge time unless --allow-unresolved-threads (with --allow-unresolved-threads-reason) is set; outdated unresolved threads are mechanically dispositioned stale (recorded in data.stale_thread_dispositions) and do not block"
    error_kind: unresolved_review_threads
    exit: DATA
  review_convergence:
    rule: "when enabled, the initial provider head and every review commit OID are non-empty, a complete paginated current-head native-review snapshot has no effective CHANGES_REQUESTED, already-observed configured bot activity stays quiet for the resolved quiet_period, and a final pre-merge snapshot has not changed; absent observed bots never wait"
    error_kind: review_changes_requested | review_convergence_head_missing | review_convergence_head_changed | review_convergence_activity_changed | review_snapshot_incomplete | invalid_review_convergence_config | review_convergence_timeout | backend_output_limit | provider_unsupported
    exit: DATA | UNAVAILABLE | USAGE
  tasklist_complete:
    rule: "no unchecked task-list items in the PR/MR description at merge time unless --allow-unchecked-tasks (with --allow-unchecked-tasks-reason) is set"
    error_kind: unchecked_task_items
    exit: DATA
  label_catalog:
    rule: "when --strict-labels is set, every selected label exists in --label-catalog, applies to the target, and exclusive groups do not conflict"
    error_kind: label_unknown | label_not_applicable | label_group_conflict | label_catalog_missing
    exit: DATA
  repo_required:
    rule: "repository-scoped operations resolve a single repository from --repo or a same-authority detected forge remote; explicit --host never borrows a repository from another authority"
    error_kind: repo_required
    exit: DATA
  repo_shape:
    rule: "repository-scoped operations require owner/name for GitHub, group[/subgroup...]/project for GitLab, or a non-empty local-compatible path; repository-independent operations skip this irrelevant shape check"
    error_kind: repo_invalid
    exit: DATA
  ref_invalid:
    rule: "search refs-to <ref> parses as a GitHub URL, owner/name#number, or #number / number"
    error_kind: ref_invalid
    exit: DATA
  test_first_evidence:
    rule: "when [test_first].require resolves true (repo or global config) and --kind is feature/bug, --test-first-evidence <dir> must point at a verified v2 record with a testable classification, contract delta, affected-test decision, meaningful failing evidence or explicit waiver, scoped passing validation, residual-gap declaration, immutable repository/baseline subject, and a latest delivery head/tree/diff attestation matching the selected ref and provider PR/MR head OID through merge CAS; docs/chore/ci/refactor are exempt"
    error_kind: test_first_evidence_required | test_first_evidence_v1 | test_first_evidence_classification | test_first_evidence_incomplete | test_first_evidence_unbound | test_first_evidence_subject_mismatch | test_first_evidence_provider_head_unavailable | test_first_evidence_provider_head_mismatch | test_first_evidence_unreadable
    exit: DATA

# ---------------------------------------------------------------------------
# Global flags every subcommand inherits.
# ---------------------------------------------------------------------------
global_flags:
  - name: --format
    type: enum<text|json>
    default: text
  - name: --remote
    type: string
    default: origin
  - name: --provider
    type: enum<github|gitlab|local>
    default: auto
  - name: --host
    type: authority<hostname|hostname:port>
    default: derived-from-remote-or-provider-default
    validation: "reject schemes, userinfo, paths, query, fragment, whitespace, control characters, malformed DNS labels, and invalid ports; normalize :443 and retain non-default ports"
    routing: "with --provider, accept a valid custom authority unless classified as the other provider; without --provider, require a recognized provider authority"
  - name: --repo
    type: string  # provider-specific repository path
    default: derived-from-same-authority-remote
  - name: --dry-run
    type: bool
    default: false

provider_resolution:
  forced_provider_only: "an existing remote must expose a valid authority classified as that provider; mismatched or unclassified remotes fail closed; the provider default applies only when no remote URL exists"
  recognized_hosts: [github.com, "*.github.com", "*.ghe.com", gitlab.com, "*.gitlab.com"]
  canonical_aliases: { ssh.github.com: github.com, altssh.gitlab.com: gitlab.com }
  repository_scopes:
    scoped: "validate repo_shape; explicit --host requires --repo or a same-authority remote repository"
    independent: "retain repository context but skip repo_shape validation"
  backend_environment: "remove ambient GH_HOST and GITLAB_HOST, then bind the resolved authority through the selected provider's host variable for each call"
  inbox_global_host: "reject global --host with provider_unsupported; --gitlab-host is the inbox-local GitLab authority control and GitHub Enterprise inbox is unsupported in v1"
  graphql_rate_limit: "bind probes to the triggering GitHub authority and key cached readings/invalidation by canonical authority"

review_state_contract:
  schema: forge-cli.review-loop.v1
  storage: "append-only provider-visible PR issue comments authored by the current viewer or an OWNER/MEMBER/COLLABORATOR; marker-shaped comments from unprivileged actors are ignored"
  provider_marker_limit: "64 KiB per encoded state marker (review_state_record_too_large) and 64 KiB per complete rendered comment body (review_state_comment_too_large), both validated before provider mutation. The complete-body limit is the binding one, so the effective marker budget is reduced by the rendered wrapper; a chain whose next record would need the final wrapper-sized portion of the marker budget cannot be appended and has no pruning path, because the ledger is append-only"
  canonical_digest: "sha256:<lowercase hex> over compact UTF-8 JSON in declared field order"
  comment_body: "tool-neutral notice `Review checkpoint — review progress recorded.` FIRST, then the unchanged marker on its own line, then — only for a combined delivery outcome — a `---` rule and the outcome. GitHub hides HTML comments when it renders Markdown, so a marker-only body renders blank. The notice-first ordering is load-bearing: a Markdown HTML block opened in caller text runs until a line containing `-->`, so caller text above the notice could swallow the notice and the marker. Presentation never enters a digest, chain order, or the parser, so historical bare-marker comments and rendered comments validate as one chain with no migration and no edit or deletion of history. Record-specific generation, payload-kind, and head bookkeeping remains only in the hidden marker"
  combined_outcome: "pr.review-loop.observe --body/--body-file appends the record and a human-readable delivery outcome in ONE comment. Deduplication is by RECORD, not by comment body, so two concurrent sessions computing the identical transition converge on one record even with divergent outcomes; each session confirms only its own. outcome_posted is set only after a post-write read-back finds a privileged comment carrying both this record's marker and this outcome, and a durable record whose outcome is not visible fails as review_outcome_not_posted. An unchanged observation appends nothing, so a supplied outcome is either already present (outcome_posted true, appended false) or fails closed as review_outcome_not_posted rather than being dropped. A hard-stop receipt is always appended without an outcome body. An outcome body containing any HTML comment is refused as review_state_comment_invalid: a review-state marker of its own would shadow the record, and an unterminated `<!--` would hide the notice. APPLICABILITY: the combined form fits only a caller whose delivery outcome is decided once and never revised, because a ledger record is immutable and an append is conditional. A workflow whose outcome must post after repairs and be refreshed on retry must keep the outcome as its own comment; agent-runtime-kit's delivery skills are in that category by contract, and rely on the visible notice rather than consolidation"
  record:
    required: [schema, repository, pr, expected_head, generation, previous_digest, payload, record_digest]
    chain: "one genesis; zero-based contiguous generations; previous_digest binds the unique prior record; byte-identical append retries are deduplicated, while conflicting duplicates, forks, stale, missing, or unreachable records fail as review_state_conflict"
  review_run_receipt:
    required: [review_run_id, route_lenses, decision, expected_head, round, summary_digest, inline_manifest]
    review_run_preimage: [repository, pr, expected_head, round, route_lenses, decision, summary_digest, inline_manifest]
    manifest_item_required: [index, path, line, side, start_line, start_side, subject_type, body_digest]
  markers:
    state: "<!-- forge-cli:review-state:v1 <lowercase-hex-record-json> -->"
    review: "<!-- forge-cli:review-run:v1 run=<review_run_id> -->"
    finding: "<!-- forge-cli:review-finding:v1 run=<review_run_id> digest=<body_digest> -->"
  privacy_forbidden: [authentication_tokens, credentials, environment_values, local_paths, private_identity_profile_names]

# ---------------------------------------------------------------------------
# Atomic operations.
# ---------------------------------------------------------------------------
operations:

  - id: pr.create
    schema_version: cli.forge-cli.pr.create.v1
    summary: Open a draft pull/merge request from the current branch.
    inputs:
      - { name: --head,        type: string,         default: current-branch } # GitHub-only seam: <user>:<branch>; gh does not support organization qualifiers
      - { name: --base,        type: string,         default: repo-default-branch }
      - { name: --title,       type: string,         required: true }
      - { name: --body,        type: string,         required: false }
      - { name: --body-file,   type: path,           required: false }
      - { name: --kind,        type: enum<feature|bug>, required: true }
      - { name: --draft,       type: bool,           default: true }
      - { name: --reviewer,    type: list<string>,   default: [] }
      - { name: --label,       type: list<string>,   default: [] }
      - { name: --label-catalog, type: path,          required: false }
      - { name: --strict-labels, type: bool,          default: false }
      - { name: --test-first-evidence, type: path,    required: false } # required only when [test_first].require resolves true for feature/bug
    validations:
      - branch_name
      - branch_kind_matches
      - title_length
      - no_local_path # title + body
      - no_agent_attribution # title + body
      - body_summary
      - body_test_plan
      - label_catalog # only when --strict-labels is set
      - worktree_clean
      - head_pushed
      - qualified_github_head # only for GitHub <user>:<branch>; binds upstream repository + provider branch/repository/SHA read-back
      - test_first_evidence # only when [test_first].require resolves true
    backends:
      github:
        program: gh
        argv: [pr, create, "--draft", "--head", "{head}", "--base", "{base}", "--title", "{title}", "--body-file", "{body_file_or_temp}"]
        json: { read_after: true, command: [pr, view, "{number}", --json, "number,url,state,isDraft,title,headRefName,headRefOid,headRepository,baseRefName,mergeable,mergedAt,mergeCommit,labels,body,closingIssuesReferences"] }
      gitlab:
        program: glab
        argv: [mr, create, "--draft", "--source-branch", "{head}", "--target-branch", "{base}", "--title", "{title}", "--description", "{body_or_body_file}"]
        json: { read_after: true, command: [mr, view, "{iid}", -F, json] }
    output:
      data:
        number: integer
        url: string
        head: string
        head_sha: optional<string>
        head_repository: optional<string>
        base: string
        draft: bool
        title: string
        kind: enum<feature|bug>
        provider: enum<github|gitlab>

  - id: pr.view
    schema_version: cli.forge-cli.pr.view.v1
    summary: Fetch a single PR/MR with normalised fields.
    inputs:
      - { name: <id>, type: integer-or-branch, required: true }
    validations: []
    backends:
      github: { program: gh,   argv: [pr,   view, "{id}", --json, "number,url,state,isDraft,title,headRefName,headRefOid,headRepository,baseRefName,mergeable,mergedAt,mergeCommit,labels,body,closingIssuesReferences"] }
      gitlab: { program: glab, argv: [mr,   view, "{id}", -F, json] }
    output:
      data:
        number: integer
        url: string
        state: enum<open|closed|merged>
        draft: bool
        title: string
        head: string
        head_sha: optional<string>
        head_repository: optional<string>
        base: string
        mergeable: enum<yes|no|unknown>
        merged_at: optional<string>
        merge_commit_sha: optional<string>
        labels: list<string>
        body: optional<string>   # GitHub `body` / GitLab `description`; null when the response omits it
        closing_issue_refs: list<{ number, url }>  # GitHub closingIssuesReferences (Closes/Fixes #N); always [] on GitLab / when absent

  - id: pr.list
    schema_version: cli.forge-cli.pr.list.v1
    summary: List PRs/MRs filtered by author / state / branch.
    inputs:
      - { name: --state,  type: enum<open|closed|merged|all>, default: open }
      - { name: --author, type: string,                       required: false }
      - { name: --head,   type: string,                       required: false }
      - { name: --limit,  type: integer,                      default: 30 }
    validations: []
    backends:
      github: { program: gh,   argv: [pr, list, --json, "number,url,state,title,headRefName,author"] }
      gitlab: { program: glab, argv: [mr, list, -F, json] }
    output:
      data:
        items: list<{ number, url, state, title, head, author }>

  - id: pr.edit
    schema_version: cli.forge-cli.pr.edit.v1
    summary: Mutate PR/MR title, body, base, labels, reviewers.
    inputs:
      - { name: <id>,        type: integer, required: true }
      - { name: --title,     type: string,  required: false }
      - { name: --body,      type: string,  required: false }
      - { name: --body-file, type: path,    required: false }
      - { name: --base,      type: string,  required: false }
      - { name: --add-label,    type: list<string>, default: [] }
      - { name: --remove-label, type: list<string>, default: [] }
      - { name: --add-reviewer, type: list<string>, default: [] }
    validations:
      - title_length   # when --title supplied
      - no_local_path  # title when --title; body when --body / --body-file
      - no_agent_attribution # title when --title; body when --body / --body-file
      - body_summary   # when --body or --body-file supplied
      - body_test_plan # when --body or --body-file supplied
    backends:
      github: { program: gh,   argv: [pr, edit,   "{id}"] }
      gitlab: { program: glab, argv: [mr, update, "{id}"] }

  - id: pr.comment
    schema_version: cli.forge-cli.pr.comment.v1
    summary: Append a comment to a PR/MR.
    inputs:
      - { name: <id>,        type: integer, required: true }
      - { name: --body,      type: string,  required: false }
      - { name: --body-file, type: path,    required: false }
    validations:
      - no_local_path # comment body
      - no_agent_attribution # comment body
    backends:
      github: { program: gh,   argv: [pr, comment, "{id}", --body, "{body_or_file}"] }
      gitlab: { program: glab, argv: [mr, note,    "{id}", --message, "{body_or_file}"] }

  - id: pr.review
    schema_version: cli.forge-cli.pr.review.v1
    summary: Post an already-rendered review outcome to a PR/MR and optionally mirror issue activity.
    inputs:
      - { name: <id>,             type: integer, required: true }
      - { name: --decision,       type: enum<comments-only|approve|request-changes>, default: comments-only }
      - { name: --comment,        type: string,  required: false }
      - { name: --comment-file,   type: path,    required: false }
      - { name: --lens,           type: list<string>, default: [] }
      - { name: --issue,          type: integer, required: false }
      - { name: --mirror-issue,   type: bool,    default: false }
      - { name: --submit-review,  type: bool,    default: false } # GitHub-only: submit a native review event (#pullrequestreview-) instead of an outcome comment; --decision maps to event (comments-only->COMMENT, approve->APPROVE, request-changes->REQUEST_CHANGES); body required for COMMENT/REQUEST_CHANGES, optional for APPROVE
      - { name: --expected-head,  type: string,  required: false } # Required with --submit-review and invalid without it; compared with the complete pending-review snapshot head before mutation and bound to the REST commit_id / GraphQL commitOID
      - { name: --thread-file,    type: path,    required: false } # GitHub-only JSON array of actionable review-thread specs; requires --submit-review; max 256 KiB, 50 specs, 1024-byte paths, 16 KiB bodies. Use only for findings that should be repaired then resolved via pr review-threads resolve.
    validations:
      - no_local_path # review comment body, thread spec bodies/paths, AND the generated issue mirror (lens values are user-controlled), validated before any post
      - no_agent_attribution # review comment body, thread spec bodies, AND the generated issue mirror, validated before any post (thread paths carry no prose)
      - no_escaped_control_markdown # review comment body, thread spec bodies/paths, AND the generated issue mirror, validated before any post
    # Op-specific error kinds:
    #   issue_required (DATA 65)       — --mirror-issue without --issue
    #   id_not_pull_request (DATA 65)  — GitHub <id> is not a pull request (the guard saw HTTP 404)
    #   invalid_review_thread_spec (DATA 65) — malformed, oversized, or locally invalid thread spec fields
    #   thread_file_requires_submit_review (DATA 65) — --thread-file without --submit-review
    #   expected_review_head_required (DATA 65) — --submit-review without --expected-head
    #   expected_review_head_requires_submit_review (DATA 65) — --expected-head without --submit-review
    #   github_review_head_changed (DATA 65) — the provider head differs from --expected-head; returned before native review mutation
    #   provider_unsupported (USAGE 64) — --submit-review or --thread-file on gitlab/local (native review/thread creation is GitHub-only in v1)
    #   github_pending_review_exists (RUNTIME 1) — summary-only native review submission found a viewer-owned pending review. Threaded review transactions instead inspect an exact receipt-bound draft and resume it.
    #   github_native_review_rejected (RUNTIME 1) — GitHub rejected native review submission with HTTP 422; retry with an eligible reviewer identity or omit --submit-review for an outcome comment fallback
    #   pending_review_transaction_incomplete (DATA 65) — a receipt-bound pending review was created or updated but the next step was not confirmed. The draft and inline content are preserved; rerunning the identical command resumes it.
    #   pending_review_manifest_mismatch (DATA 65) — the pending body, inline-comment prefix, run marker, decision inputs, or immutable manifest differs. No mutation follows.
    #   pending_review_identity_mismatch (DATA 65) — the authenticated viewer does not own the receipt-bound pending review. No mutation follows.
    #   pending_review_lease_busy (UNAVAILABLE 69) — another cooperating forge-cli process owns the provider/host/repository/PR/viewer pending-review mutation lease.
    #   pending_review_lease_unsafe (DATA 65) — the private local lease directory or file does not satisfy ownership/type/mode invariants.
    #   review_state_conflict (DATA 65) — the append-only provider-visible receipt chain is malformed, forked, or binds one run id to different immutable inputs.
    # A non-404 guard failure (rate limit, 5xx, forbidden/SSO) surfaces as backend_error (RUNTIME 1),
    # not id_not_pull_request, since it may have hit a valid PR.
    backends:
      github:
        - { program: gh, argv: [api, "repos/{repo}/pulls/{id}", --jq, ".number"] } # PR-existence guard; <id> must be a pull request before posting (also rendered in --dry-run as guard_plan)
        - { program: gh, argv: [api, "repos/{repo}/issues/{id}/comments", --method, POST, --raw-field, "body={comment_or_file}", --jq, ".html_url"] } # default (outcome comment)
        - { program: gh, argv: [api, graphql, -f, "query=<pending reviews with viewer ownership>", -f, "owner={owner}", -f, "name={repo}", -F, "pr={id}"] } # summary-only --submit-review: a viewer-owned pending review returns github_pending_review_exists. Threaded transactions use this as the complete membership read before exact-node inspection/resume.
        - { program: gh, argv: [api, "repos/{repo}/pulls/{id}/reviews", --method, POST, --raw-field, "body={comment_or_file}", --raw-field, "event={EVENT}", --raw-field, "commit_id={expected_head}", --jq, ".html_url"] } # with --submit-review (native review event); body field omitted for a body-less APPROVE; commit_id binds the mutation to --expected-head; review authored by the inherited gh token's identity
        - { program: gh, argv: [api, graphql, -f, "query=<pull request id lookup>", -f, "owner={owner}", -f, "name={repo}", -F, "number={id}"] } # with --thread-file: resolve the PR node id
        - { program: gh, argv: [api, graphql, -f, "query=<authenticated viewer plus paginated PR issue comments with author association>", -f, "owner={owner}", -f, "name={repo}", -F, "pr={id}", "-f after={cursor}?"] } # with --thread-file: retain the current viewer's and privileged collaborators' comments, then read and validate the forge-cli.review-loop.v1 append-only state chain
        - { program: gh, argv: [api, "repos/{repo}/issues/{id}/comments", --method, POST, --raw-field, "body=<visible ledger metadata line plus immutable review-run receipt marker>", --jq, ".html_url"] } # append one provider-bounded receipt before native-review mutation, then verify from the prior cursor/tail; semantically identical append retries and reruns reuse it. The prewrite stays a distinct comment because recovery needs durable state before the mutation, so it carries no delivery outcome
        - { program: gh, argv: [api, graphql, -f, "query=<complete submitted native reviews plus authenticated viewer>", -f, "owner={owner}", -f, "name={repo}", -F, "pr={id}", "-f after={cursor}?"] } # only when an exact receipt exists before mutation: idempotent success requires viewer author, expected head/state, untruncated marker, and complete receipt-bound thread manifest
        - { program: gh, argv: [api, graphql, -f, "query=<complete exact pending review and inline-comment manifest>", -f, "review={review_id}", "-f after={cursor}?"] } # exact receipt/body/head/commit/identity/manifest validation before any resumed mutation
        - { program: gh, argv: [api, graphql, -f, "query=<addPullRequestReview>", -f, "pullRequestId={pull_request_id}", -f, "commitOID={expected_head}", -f, "body={summary plus review-run marker}"] } # create only when no viewer-owned draft exists
        - { program: gh, argv: [api, graphql, -f, "query=<addPullRequestReviewThread>", -f, "reviewId={review_id}", -f, "path={path}", -f, "body={finding marker plus semantic body}", -F, "line={line}", -f, "side={LEFT|RIGHT}", -f, "subjectType={LINE|FILE}"] } # add only the missing ordered manifest suffix; never delete completed inline content
        - { program: gh, argv: [api, graphql, -f, "query=<submitPullRequestReview>", -f, "reviewId={review_id}", -f, "event={EVENT}", -f, "body={summary plus review-run marker}"] } # create/thread/submit mutations run under the private provider/host/repository/PR/viewer cross-process lease; submit only after a final exact complete snapshot
        - { program: gh, argv: [api, graphql, -f, "query=<complete exact submitted review and inline-comment manifest>", -f, "review={review_id}", "-f after={cursor}?"] } # mandatory immediate reconciliation after submit, including lost mutation responses; success requires the exact submitted state and receipt-bound manifest
        - { program: gh, argv: [api, "repos/{repo}/issues/{issue}/comments", --method, POST, --raw-field, "body=<generated mirror>", --jq, ".html_url"] } # only with --mirror-issue
      gitlab:
        # One `glab mr note create --help` probe selects the form (covers every glab version class):
        #   advertises --resolvable        -> non-resolvable status note (does not block the merge gate)
        - { program: glab, argv: [mr, note, create, "{id}", --message, "{comment_or_file}", "--resolvable=false"] }
        #   `create` exists, no --resolvable -> same subcommand without the flag (note stays resolvable)
        - { program: glab, argv: [mr, note, create, "{id}", --message, "{comment_or_file}"] }
        #   no `create` subcommand          -> bare note form (the only form such builds support)
        - { program: glab, argv: [mr, note, "{id}", --message, "{comment_or_file}"] }
        - { program: glab, argv: [issue, note, "{issue}", --message, "<generated mirror>"] } # only with --mirror-issue
      # local: provider_unsupported in v1; local PR mutation is not modelled.
    output:
      data:
        provider: enum<github|gitlab>
        number: integer
        decision: enum<comments-only|approve|request-changes>
        submitted_review: bool # true only when this invocation submitted a native review event. An exact completed rerun is false but retains the original #pullrequestreview- pr_comment_url
        head_sha?: string # present with --submit-review; the caller-reviewed head bound to preflight and mutation
        pending_review_guard_plan?: list<string> # dry-run only, with --submit-review: pending-only GraphQL preflight argv
        review_state_plan?: list<string> # dry-run only with --thread-file: authenticated provider-state read
        review_receipt_plan?: list<string> # dry-run only with --thread-file: immutable receipt append
        review_state_verify_plan?: list<string> # dry-run only with --thread-file: post-append state verification
        pr_comment_url: string
        issue_number: integer?
        issue_comment_url: string?
        mirrored: bool
        lenses: list<string>
        review_threads?: "list<{ id: string, url: string, path: string, line?: integer, subject_type: enum<LINE|FILE> }>"
        threads_skipped_idempotent?: integer # cross-run duplicates skipped: findings whose (path, body) already had a live (non-resolved, non-outdated) thread on the current head; omitted when 0. When every finding is a duplicate the review event is skipped, so submitted_review is false

  - id: pr.review.validate
    schema_version: cli.forge-cli.pr.review.validate.v1
    summary: Validate review summary and review-thread specs before posting provider-visible review activity.
    inputs:
      - { name: <id>,           type: integer, required: false } # required with --check-diff
      - { name: --comment,      type: string,  required: false }
      - { name: --comment-file, type: path,    required: false }
      - { name: --thread-file,  type: path,    required: false }
      - { name: --check-diff,   type: bool,    default: false } # GitHub-only in v1; validates thread paths/lines against live PR diff
    validations:
      - no_local_path # review comment body plus thread spec bodies/paths
      - no_agent_attribution # review comment body plus thread spec bodies
      - no_escaped_control_markdown # review comment body plus thread spec bodies/paths
    # Op-specific error kinds:
    #   invalid_review_thread_spec (DATA 65) — malformed, oversized, or locally invalid thread spec fields
    #   review_validate_id_required (DATA 65) — --check-diff without <id>
    #   review_thread_file_not_changed (DATA 65) — a thread spec path is absent from the live GitHub PR file list
    #   review_thread_line_not_in_diff (DATA 65) — a line thread points at a line that is not commentable on the requested diff side
    #   review_thread_range_not_in_diff (DATA 65) — a ranged thread is reversed or spans multiple diff hunks
    #   provider_unsupported (USAGE 64) — --check-diff on gitlab/local (live diff-coordinate validation is GitHub-only in v1)
    dry_run:
      offline: true
      plan_field: diff_plan
      note: "With --check-diff, emits the planned GitHub PR files argv and leaves review_threads.diff_checked=false."
    backends:
      github:
        - { program: gh, argv: [api, "repos/{repo}/pulls/{id}/files", --paginate] } # only with --check-diff
      # gitlab/local: local schema/privacy validation only; --check-diff returns provider_unsupported.
    output:
      data:
        provider: enum<github|gitlab|local>
        number: integer?
        check_diff: bool
        diff_plan: list<string>? # dry-run only when --check-diff is set
        comment: { present: bool, bytes: integer, lines: integer }
        review_threads:
          count: integer
          diff_checked: bool
          specs: 'list<{ index: integer, path: string, line?: integer, side: enum<LEFT|RIGHT>, start_line?: integer, start_side?: enum<LEFT|RIGHT>, subject_type: enum<LINE|FILE>, body_bytes: integer }>'

  - id: pr.ready
    schema_version: cli.forge-cli.pr.ready.v1
    summary: Promote a draft PR/MR to ready-for-review.
    inputs:
      - { name: <id>, type: integer, required: true }
    validations:
      - worktree_clean
    backends:
      github: { program: gh,   argv: [pr, ready,  "{id}"] }
      gitlab: { program: glab, argv: [mr, update, "{id}", "--ready"] }

  - id: pr.review-threads
    schema_version: cli.forge-cli.pr.review-threads.v1
    summary: List review threads attached to a PR/MR with their resolved state.
    inputs:
      - { name: <id>, type: integer, required: true }
    dry_run:
      offline: true
      repo_resolution: "--repo owner/name or recognised forge remote"
    backends:
      github: { program: gh,   argv: [api, graphql, "--hostname <host when host != github.com>", -f, "query=<reviewThreads query>", -f, "owner={owner}", -f, "name={name}", -F, "pr={id}"] }
      gitlab: { program: glab, argv: [api, --paginate, --hostname, "{host}", "projects/{project}/merge_requests/{id}/discussions?per_page=100"] }
      # local: no review-thread model; returns an empty thread list.
    output:
      data:
        number: integer
        url: string
        total: integer
        unresolved: integer
        threads: list<{id,resolved,outdated,author,path,diff_side?,line?,original_line?,original_start_line?,start_diff_side?,start_line?,subject_type?,created_at,url,body,comments}>

  - id: pr.review-threads.resolve
    schema_version: cli.forge-cli.pr.review-threads.resolve.v1
    summary: Resolve a review thread, optionally posting a reply first (GitHub-only in v1).
    inputs:
      - { name: <id>,        type: integer, required: true }
      - { name: --thread,    type: string,  required: true }   # thread node id (PRRT_...)
      - { name: --note,      type: string,  required: false }  # optional reply posted before resolving
      - { name: --note-file, type: path,    required: false }
    validations:
      - no_local_path # optional reply note
      - no_agent_attribution # optional reply note
      - review_thread_pr_mismatch # live GitHub only: --thread must belong to <id> before mutation
    backends:
      # With a note: the reply mutation runs first, then resolve. Without a
      # note: only resolve. resolveReviewThread is idempotent — resolving an
      # already-resolved thread succeeds rather than erroring.
      github:
        - { program: gh, argv: [api, graphql, "--hostname <host when host != github.com>", -f, "query=<addPullRequestReviewThreadReply>", -f, "tid={thread}", -f, "body={note_or_file}"] }  # only when --note/--note-file given
        - { program: gh, argv: [api, graphql, "--hostname <host when host != github.com>", -f, "query=<resolveReviewThread>", -f, "tid={thread}"] }
      gitlab: unsupported  # no GitHub-shaped thread-mutation surface in v1 → provider_unsupported (USAGE 64)
      # local: no thread model → provider_unsupported (USAGE 64).
    output:
      data:
        provider: enum<github>
        thread_id: string
        resolved: bool
        replied: bool

  - id: pr.review-threads.reply
    schema_version: cli.forge-cli.pr.review-threads.reply.v1
    summary: Reply to a review thread without resolving it (GitHub-only in v1).
    inputs:
      - { name: <id>,        type: integer, required: true }
      - { name: --thread,    type: string,  required: true }   # thread node id (PRRT_...)
      - { name: --body,      type: string,  required: false }
      - { name: --body-file, type: path,    required: false }
    validations:
      - no_local_path # reply body
      - no_agent_attribution # reply body
      - review_thread_pr_mismatch # live GitHub only: --thread must belong to <id> before mutation
    backends:
      github: { program: gh, argv: [api, graphql, "--hostname <host when host != github.com>", -f, "query=<addPullRequestReviewThreadReply>", -f, "tid={thread}", -f, "body={body_or_file}"] }
      gitlab: unsupported  # provider_unsupported (USAGE 64)
      # local: provider_unsupported (USAGE 64).
    output:
      data:
        provider: enum<github>
        thread_id: string
        comment_url: string

  - id: pr.reviews
    schema_version: cli.forge-cli.pr.reviews.v1
    summary: Read bounded provider-native GitHub review summaries classified against the current PR head.
    inputs:
      - { name: <id>, type: integer, required: true }
    dry_run:
      offline: true
      repo_resolution: "--repo owner/name or recognised forge remote"
    backends:
      github: { program: gh, argv: [api, graphql, "--hostname <host when host != github.com>", -f, "query=<headRefOid and paginated reviews query>", -f, "owner={owner}", -f, "name={name}", -F, "pr={id}", "-f after={cursor}?"] }
      gitlab: unsupported # provider_unsupported (USAGE 64)
      local: unsupported  # provider_unsupported (USAGE 64)
    output:
      data:
        provider: enum<github>
        number: integer
        url: string
        head_sha: string
        viewer_login: string # additive authenticated-viewer identity used by transaction recovery; may be empty only on generic reads from older provider responses
        current_head_reviews: list<{id, database_id?, url, author, state, commit_sha, submitted_at, summary, summary_truncated}>
        stale_reviews: list<{id, database_id?, url, author, state, commit_sha, submitted_at, summary, summary_truncated}>
        pending_reviews: list<{id, database_id?, url, author, state, commit_sha?, summary, summary_truncated}>
    notes: "all review pages are read (100 nodes/page, max 100 pages); provider-valid PENDING reviews have no submitted_at, may have no commit_sha, and are returned separately, never as convergence activity. Partial GraphQL data, missing required submitted-review fields, unknown states, head drift, or unsafe pagination return review_snapshot_incomplete. summary is bounded to 4096 UTF-8 bytes and is never parsed as a machine verdict; submitted commit_sha != head_sha is stale/informational."

  - id: pr.pending-review.inspect
    schema_version: cli.forge-cli.pr.pending-review.inspect.v1
    summary: Read one complete pending GitHub review and its immutable snapshot digest.
    inputs:
      - { name: <id>, type: integer, required: true }
      - { name: --review, type: string, required: true }
    validations:
      - pending_review_not_found
      - pending_review_pr_mismatch
      - review_snapshot_incomplete
      - pending_review_manifest_mismatch
    backends:
      github:
        - { program: gh, argv: [pr, view, "{id}", --json, "number,url,state,isDraft,baseRefName,headRefName,headRefOid,title,body"] }
        - { program: gh, argv: [api, graphql, "--hostname <host when host != github.com>", -f, "query=<exact pending PullRequestReview plus complete paginated inline-comment manifest>", -f, "review={review_id}", "-f after={cursor}?"] }
      gitlab: unsupported
      local: unsupported
    output:
      data:
        provider: enum<github>
        number: integer
        url: string
        snapshot: object<{number,pr_url,head_sha,review_id,review_url,author,commit_sha?,body,semantic_body,viewer_did_author,viewer_can_delete,review_run_id?,provenance,inline_comments:list<{id,url,author,body,semantic_body,created_at,path,line?,original_line?,diff_side?,start_line?,original_start_line?,start_diff_side?,subject_type,body_digest,review_run_id?}>,snapshot_digest}>
    notes: "The read is complete and fail-closed: every inline-comment page repeats the same review, PR, head, commit, author, body, viewer-capability identity, and stable totalCount. totalCount above 1,000 is rejected before another page, and the decoded retained snapshot is capped at 4 MiB. The snapshot and digest preserve diff_side and start_diff_side as well as line/range anchors. Owned versioned markers are removed only from semantic_body; raw provider content remains visible in the snapshot. provenance is receipt-bound or unmarked, while mixed or digest-mismatched markers return pending_review_manifest_mismatch."

  - id: pr.pending-review.resume-submit
    schema_version: cli.forge-cli.pr.pending-review.resume-submit.v2
    summary: Submit one exact receipt-bound pending review after final compare-and-swap validation.
    inputs:
      - { name: <id>, type: integer, required: true }
      - { name: --review, type: string, required: true }
      - { name: --review-run-id, type: string, required: true }
      - { name: --expected-head, type: string, required: true }
      - { name: --expected-commit, type: string, required: true }
      - { name: --expected-snapshot, type: string, required: true }
      - { name: --decision, type: enum<approve|request-changes|comments-only>, required: true }
    validations:
      - pending_review_not_found
      - pending_review_pr_mismatch
      - pending_review_head_changed
      - pending_review_commit_mismatch
      - pending_review_manifest_mismatch
      - pending_review_identity_mismatch
      - pending_review_lease_busy
      - pending_review_lease_unsafe
      - pending_review_reconciliation_failed
    backends:
      github:
        - { program: gh, argv: [pr, view, "{id}", --json, "number,url,state,isDraft,baseRefName,headRefName,headRefOid,title,body"] }
        - { program: gh, argv: [api, graphql, -f, "query=<complete pending-review snapshot>", -f, "review={review_id}", -f, "after={cursor}?"] }
        - { program: gh, argv: [api, graphql, "-f", "query=<submitPullRequestReview>", -f, "reviewId={review_id}", -f, "event={decision}", -f, "body={preserved_body}"] }
        - { program: gh, argv: [api, graphql, -f, "query=<complete submitted native reviews>", -f, "owner={owner}", -f, "name={repo}", -F, "pr={id}", "-f after={cursor}?"] } # when the exact node is no longer pending, verify the same submitted run/review/head/commit/decision and return idempotent success without mutation
      gitlab: unsupported
      local: unsupported
    output:
      data: object<{provider,number,url,review_id,review_url,head_sha,commit_sha,snapshot_digest?,snapshot_provenance,review_run_id,submitted}>
    notes: "Version 2 makes snapshot_digest nullable and adds snapshot_provenance so idempotent recovery never misrepresents an unprovable former pending digest. The exact receipt-bound pending snapshot is submitted once under a private provider/host/repository/PR/viewer cross-process lease, then its complete submitted manifest is immediately reconciled. FILE receipt anchors accept provider-null side/range fields; LINE and range anchors remain exact. A live reconciled submit reports snapshot_provenance=pending-cas+submitted-reconciled. If submission already completed, a complete submitted-review read-back authored by the authenticated viewer with the same review_run_id, review id, current head, commit, decision state, and complete receipt-bound thread manifest returns idempotent success without another mutation, with snapshot_digest=null and snapshot_provenance=pending-snapshot-unverified because the former pending digest cannot be proven. GitHub provides no submission CAS, so the lease excludes cooperating forge-cli processes but cannot exclude a same-identity non-cooperating provider client between final read and mutation."

  - id: pr.pending-review.submit
    schema_version: cli.forge-cli.pr.pending-review.submit.v1
    summary: Guardedly submit one exact unmarked pending review without deleting inline content.
    inputs:
      - { name: <id>, type: integer, required: true }
      - { name: --review, type: string, required: true }
      - { name: --expected-head, type: string, required: true }
      - { name: --expected-commit, type: string, required: true }
      - { name: --expected-snapshot, type: string, required: true }
      - { name: --decision, type: enum<approve|request-changes|comments-only>, required: true }
      - { name: --confirm-unmarked-submit, type: bool, required: true }
    validations:
      - pending_review_not_found
      - pending_review_pr_mismatch
      - pending_review_head_changed
      - pending_review_commit_mismatch
      - pending_review_manifest_mismatch
      - pending_review_identity_mismatch
      - pending_review_lease_busy
      - pending_review_lease_unsafe
      - pending_review_reconciliation_failed
    backends:
      github:
        - { program: gh, argv: [pr, view, "{id}", --json, "number,url,state,isDraft,baseRefName,headRefName,headRefOid,title,body"] }
        - { program: gh, argv: [api, graphql, -f, "query=<complete pending-review snapshot>", -f, "review={review_id}", -f, "after={cursor}?"] }
        - { program: gh, argv: [api, graphql, "-f", "query=<submitPullRequestReview>", -f, "reviewId={review_id}", -f, "event={decision}", -f, "body={preserved_body}"] }
      gitlab: unsupported
      local: unsupported
    output:
      data: object<{provider,number,url,review_id,review_url,head_sha,commit_sha,snapshot_digest,snapshot_provenance,review_run_id?,submitted}>
    notes: "The released v1 snapshot_digest remains a required string. Only provenance=unmarked is eligible. The exact snapshot digest, head, commit, viewer identity, body, and every inline comment are re-read under the cross-process lease before submission; inline content is preserved, and the complete submitted manifest is reconciled before success."

  - id: pr.pending-review.discard
    schema_version: cli.forge-cli.pr.pending-review.discard.v1
    summary: Destructively discard one exact pending review with separate inline-content approval.
    inputs:
      - { name: <id>, type: integer, required: true }
      - { name: --review, type: string, required: true }
      - { name: --expected-head, type: string, required: true }
      - { name: --expected-commit, type: string, required: true }
      - { name: --expected-snapshot, type: string, required: true }
      - { name: --confirm-discard, type: bool, required: true }
      - { name: --confirm-inline-content-loss, type: bool, required: conditional }
    validations:
      - pending_review_not_found
      - pending_review_pr_mismatch
      - pending_review_head_changed
      - pending_review_commit_mismatch
      - pending_review_manifest_mismatch
      - pending_review_identity_mismatch
      - pending_review_inline_discard_approval_required
      - pending_review_lease_busy
      - pending_review_lease_unsafe
      - pending_review_reconciliation_failed
    backends:
      github:
        - { program: gh, argv: [pr, view, "{id}", --json, "number,url,state,isDraft,baseRefName,headRefName,headRefOid,title,body"] }
        - { program: gh, argv: [api, graphql, -f, "query=<complete pending-review snapshot>", -f, "review={review_id}", -f, "after={cursor}?"] }
        - { program: gh, argv: [api, graphql, "-f", "query=<deletePullRequestReview>", -f, "reviewId={review_id}"] }
      gitlab: unsupported
      local: unsupported
    output:
      data: object<{provider,number,url,review_id,review_url,head_sha,commit_sha,snapshot_digest,inline_comment_count,discarded}>
    notes: "Deletion is never automatic. --confirm-inline-content-loss is additionally mandatory when the complete snapshot contains one or more inline comments. Mutation runs under the cross-process lease and provider absence is reconciled before success."

  - id: pr.pending-review.delete
    schema_version: cli.forge-cli.pr.pending-review.delete.v1
    summary: Verify and delete one exact pending GitHub review owned by the invoking identity.
    inputs:
      - { name: <id>, type: integer, required: true }
      - { name: --review, type: string, required: true }
      - { name: --expected-head, type: string, required: true }
      - { name: --expected-commit, type: string, required: true }
      - { name: --expected-body, type: string, required: conditional } # mutually exclusive with --expected-body-file
      - { name: --expected-body-file, type: path, required: conditional }
      - { name: --confirm-abandoned, type: bool, required: true }
    dry_run:
      offline: true
      repo_resolution: "--repo owner/name or recognised forge remote"
    validations:
      - pending_review_not_found
      - pending_review_author_mismatch
      - pending_review_not_deletable
      - pending_review_head_mismatch
      - pending_review_commit_mismatch
      - pending_review_body_mismatch
      - pending_review_body_too_large
      - pending_review_pr_mismatch
      - pending_review_inline_comments_present
      - pending_review_lease_busy
      - pending_review_lease_unsafe
      - pending_review_reconciliation_failed
    backends:
      github:
        - { program: gh, argv: [pr, view, "{id}", --json, "number,url,state,isDraft,baseRefName,headRefName,headRefOid,title,body"] }
        - { program: gh, argv: [api, graphql, "--hostname <host when host != github.com>", -f, "query=<headRefOid and paginated PENDING reviews with commit/body/viewerDidAuthor/viewerCanDelete>", -f, "owner={owner}", -f, "name={name}", -F, "pr={id}", "-f after={cursor}?"] }
        - { program: gh, argv: [api, graphql, "--hostname <host when host != github.com>", -f, "query=<exact PullRequestReview node with pullRequest, commit, body, viewer guards, and comments(first: 1) totalCount>", -f, "review={review_id}"] }
        - { program: gh, argv: [api, graphql, "--hostname <host when host != github.com>", -f, "query=<deletePullRequestReview>", -f, "reviewId={review_id}"] }
      gitlab: unsupported # provider_unsupported (USAGE 64)
      local: unsupported  # provider_unsupported (USAGE 64)
    output:
      data:
        provider: enum<github>
        number: integer
        url: string
        head_sha: string
        commit_sha: string
        review_id: string
        review_url: string
        author: string
        deleted: boolean
    notes: "destructive recovery requires an explicit --confirm-abandoned acknowledgement plus exact expected PR head, review commit, and review body. Expected and provider bodies are limited to 64 KiB; file and stdin inputs use bounded reads. The live command reads and validates a complete paginated pending-only membership snapshot while retaining only the target body, then takes the private provider/host/repository/PR/viewer lease, re-fetches the exact target node immediately before mutation, and revalidates PR membership, PENDING state, head, commit, normalized body, viewerDidAuthor, and viewerCanDelete. Inline draft comments fail with pending_review_inline_comments_present and require manual provider recovery. Body values and body-file paths are never emitted; dry-run validates a named body file and includes the exact-target plan. Only the revalidated node id is passed to deletePullRequestReview, and provider absence is reconciled before success. GitHub exposes no content CAS for that mutation, so the lease excludes cooperating forge-cli processes but not a same-identity non-cooperating provider client in the irreducible final-read-to-delete interval."

  - id: pr.review-loop.inspect
    schema_version: cli.forge-cli.pr.review-loop.inspect.v1
    summary: Inspect the validated provider-visible review-loop chain and latest typed round state.
    inputs:
      - { name: <id>, type: integer, required: true }
    backends:
      github:
        - { program: gh, argv: [pr, view, "{id}", --json, "number,url,...,headRefOid"] }
        - { program: gh, argv: [api, graphql, -f, "query=<complete privileged review-state comments>", -f, "owner={owner}", -f, "name={repo}", -F, "pr={id}", "-f after={cursor}?"] }
      gitlab: unsupported
      local: unsupported
    output:
      data: object<{provider,number,url,state_tip_digest?,generation?,state?,appended:false,outcome_posted:false}>
    notes: "The append-only forge-cli.review-loop.v1 chain is completely paginated, hash-validated, and fork-checked. ReviewRunReceipt and ReviewLoop records share one chain; no second provider store is created."

  - id: pr.review-loop.observe
    schema_version: cli.forge-cli.pr.review-loop.observe.v1
    summary: Observe one exact reviewed head and append an idempotent typed ledger transition.
    inputs:
      - { name: <id>, type: integer, required: true }
      - { name: --expected-head, type: string, required: true }
      - { name: --findings-file, type: path, required: true }
      - { name: --expected-state, type: string, required: conditional }
      - { name: --body, type: string, required: false, conflicts_with: --body-file }
      - { name: --body-file, type: path, required: false, notes: "`-` reads stdin" }
    validations:
      - review_state_conflict
      - review_fingerprint_collision
      - review_finding_reopened
      - review_no_progress
      - review_round_limit_exceeded
      - review_state_comment_invalid
      - review_state_comment_too_large
      - review_outcome_not_posted
      - local_path_present
      - markdown_escaped_control
    backends:
      github:
        - { program: gh, argv: [pr, view, "{id}", --json, "number,url,...,headRefOid"] }
        - { program: gh, argv: [api, graphql, -f, "query=<complete privileged review-state comments>", -F, "pr={id}"] }
        - { program: gh, argv: [api, "repos/{repo}/issues/{id}/comments", --method, POST, --raw-field, "body=<visible ledger metadata line, then canonical state marker, then optional `---` and delivery outcome>"] } # one comment carries both halves; with no --body/--body-file it is metadata plus marker
        - { program: gh, argv: [api, graphql, -f, "query=<complete privileged review-state comments>", -F, "pr={id}"] }
      gitlab: unsupported
      local: unsupported
    output:
      data: object<{provider,number,url,state_tip_digest,generation,state,appended,outcome_posted}>
      dry_run_data: object<{provider,plan,preflight_ok,would_append?,planned_comment?:{visible_metadata,includes_outcome_body,bytes},preflight}>
    notes: "Defaults are five repair rounds, two consecutive no-progress rounds, and zero automatic reopens. Same-head/same-finding retries append nothing; a same-head subset cannot clear an open finding. Observation rows may carry status/disposition open|fixed|accepted|preference|follow-up, with terminal dispositions recorded non-blocking. A new head advances one round; strict cardinality shrink is the only mechanical progress signal. Extendable terminal errors append a durable hard-stop receipt before returning the exact extension proposal; they never approve, resolve, or merge. --body/--body-file posts the delivery outcome in the same comment as the appended record, so outcome_posted is never true without appended; every outcome-body rule is enforced before the first provider call, and planned_comment/state_comment_body appear in a dry run only when a write is planned — including the unextended-hard-stop case, where the live path returns the stop without appending. See review_state_contract.combined_outcome for the record-vs-comment deduplication boundary. --body-file - consumes stdin once, so a dry-run-then-live sequence must not share a piped body."

  - id: pr.review-loop.extend
    schema_version: cli.forge-cli.pr.review-loop.extend.v1
    summary: Consume one exact post-stop maintainer approval and append one budget extension.
    inputs:
      - { name: <id>, type: integer, required: true }
      - { name: --expected-head, type: string, required: true }
      - { name: --expected-state, type: string, required: true }
      - { name: --stop-code, type: string, required: true }
      - { name: --budget-field, type: enum<max_repair_rounds|max_no_progress_rounds|max_auto_reopens_per_fingerprint>, required: true }
      - { name: --increment, type: integer, default: 1 }
      - { name: --proposal-digest, type: string, required: true }
      - { name: --approval-comment, type: integer, required: true }
    validations:
      - review_state_conflict
      - review_extension_invalid
      - review_extension_replayed
      - review_extension_approval_invalid
      - review_state_comment_too_large
    backends:
      github:
        - { program: gh, argv: [api, "repos/{repo}/issues/comments/{approval_comment}"] }
        - { program: gh, argv: [api, "repos/{repo}/issues/{id}/comments", --method, POST, --raw-field, "body=<visible ledger metadata line plus canonical state marker>"] } # extend never carries a delivery outcome
      gitlab: unsupported
      local: unsupported
    output:
      data: object<{provider,number,url,state_tip_digest,generation,state,appended:true,outcome_posted:false}>
    notes: "This command is separate from delivery retry paths. It requires an active durable hard-stop receipt, the canonical stop-code/budget-field pair and exact one-step proposal, plus an OWNER/MEMBER/COLLABORATOR approval comment on the same PR that is newer than the stopped state tip and carries the exact marker. One proposal can be consumed once."

  - id: pr.review-loop.validate
    schema_version: cli.forge-cli.pr.review-loop.validate.v1
    summary: Check a review-loop findings payload offline, before it reaches the provider.
    inputs:
      - { name: --findings-file, type: path, required: true }
    validations:
      - review_findings_invalid
      - review_fingerprint_required
      - review_fingerprint_collision
    backends:
      github: none
      gitlab: none
      local: none
    output:
      data: object<{shape:enum<merge-envelope|observation-array>,row_count,identity_count,dispositions:[{disposition:enum<open|fixed|accepted|preference|follow-up>,count}],blocking_count,duplicate_identities?}>
    notes: >-
      Provider-independent and network-free: the op takes no id, resolves no
      provider context, and runs no backend, so `--provider`, `--repo`,
      `--host` and `--dry-run` are accepted by the global parser and have no
      effect here. It applies exactly the offline half of `pr.review-loop.observe`
      by calling the same canonicalization the append calls, so the accept/reject
      decision cannot drift: lifecycle fingerprint form, identity collisions, and
      blocking normalization for terminal dispositions. Head and state-tip
      compare-and-swap, the transition against stored state, and the rendered
      comment need the provider and remain in `observe --dry-run`. Failing here
      proves an append cannot succeed; passing means the payload itself is
      acceptable. Unlike its siblings the payload carries neither `appended` nor
      `outcome_posted`, because nothing is ever appended.

  - id: pr.tasks
    schema_version: cli.forge-cli.pr.tasks.v1
    summary: List GFM task-list items in the PR/MR description with their state.
    inputs:
      - { name: <id>, type: integer, required: true }
    backends:
      github: { program: gh,   argv: [pr, view, "{id}", --json, "number,url,body"] }
      gitlab: { program: glab, argv: [mr, view, "{id}", -F, json] }
      # local: no body model; returns an empty item list.
    output:
      data:
        number: integer
        url: string
        total: integer
        unchecked: integer
        items: list<{checked, marker, text, line}>

  - id: pr.merge
    schema_version: cli.forge-cli.pr.merge.v1
    summary: Merge a ready PR/MR with the configured method.
    inputs:
      - { name: <id>,                       type: integer,                       required: true }
      - { name: --expected-head,            type: string,                        default: null }
      - { name: --method,                   type: enum<squash|merge|rebase>,     default: squash }
      - { name: --keep-branch,              type: bool,                          default: false }
      - { name: --allow-non-default-base,   type: bool,                          default: false }
      - { name: --allow-unresolved-threads, type: bool,                          default: false } # requires --allow-unresolved-threads-reason
      - { name: --allow-unresolved-threads-reason, type: string,                 default: null }
      - { name: --review-convergence,        type: optional<bool>,               default: resolved-config }
      - { name: --allow-unchecked-tasks,    type: bool,                          default: false }
      - { name: --allow-unchecked-tasks-reason, type: string,                    default: null }
      - { name: --allow-no-checks,          type: bool,                          default: false } # requires --allow-no-checks-reason
      - { name: --allow-no-checks-reason,   type: string,                        default: null }
    validations:
      - worktree_clean
      - test_first_evidence_provider_head_mismatch # when --expected-head is supplied, the first provider snapshot must still match it before merge mutation
      - draft_merge_refused
      - default_branch_protected
      - required_checks_green   # TTL-zero re-check
      - merge_method_supported
      - keep_branch_conflict
      - review_convergence # only when explicit/repo/global require resolves true; requires a non-empty initial provider head; GitHub-only in v1; dry-run and live validate provider parity; final complete snapshot is re-read immediately before provider merge
      - review_loop # when review convergence is enabled and a ledger exists: exact-head/no-open-findings gate plus unchanged-tip recheck immediately before merge
      - review_threads_resolved
      - tasklist_complete
    backends:
      github: { program: gh,   argv: [pr, merge, "{id}", "--{method}", "--delete-branch?"] }
      gitlab: { program: glab, argv: [mr, merge, "{id}", "--squash?", "--remove-source-branch?"] }
    output:
      data:
        number: integer
        url: string
        merge_sha: string
        method: enum<squash|merge|rebase>
        deleted_branch: bool
        unchecked_tasks_override_reason?: string # present only when --allow-unchecked-tasks bypass was used
        unresolved_threads_override_reason?: string # present only when --allow-unresolved-threads bypass was used
        no_checks_override_reason?: string # present only when --allow-no-checks bypass was used; the only durable record that a merge happened with no CI evidence
        stale_thread_dispositions?: 'list<{ thread_id: string, author: string, path: string, summary: string, disposition: "stale", rationale: string }>' # outdated unresolved threads dispositioned stale at rule 13; omitted when none
        review_convergence: optional<{required, head_sha, observed_reviews, stale_reviews, semantic_activity, semantic_digest, unresolved_threads, changes_requested_by, missing_reviewers, latest_activity_at?, quiet_until?, quiet_period_ms, timeout_ms, waited_ms, bots}>
        review_loop: optional<{state_tip_digest,head_sha,round,no_progress_rounds,open_blocking_findings}>
      dry_run_data:
        review_convergence: resolved<{require, quiet_period, timeout, bots}>

  - id: pr.close
    schema_version: cli.forge-cli.pr.close.v1
    summary: Close a PR/MR without merging.
    inputs:
      - { name: <id>, type: integer, required: true }
    validations: []
    backends:
      github: { program: gh,   argv: [pr, close, "{id}"] }
      gitlab: { program: glab, argv: [mr, close, "{id}"] }

  - id: pr.checks
    schema_version: cli.forge-cli.pr.checks.v1
    summary: One-shot snapshot of PR/MR check state.
    inputs:
      - { name: <id>,           type: integer-or-branch, required: true }
      - { name: --required-only, type: bool,             default: true }
    validations: []
    backends:
      github: { program: gh,   argv: [pr, checks, "{id}", --json, "name,state,bucket,workflow,link,startedAt,completedAt,description"] }
      github_required: { program: gh, argv: [pr, checks, "{id}", --required, --json, "name,state,bucket,workflow,link,startedAt,completedAt,description"] }
      github_head_fallback: { program: gh, argv: [pr, view, "{id}", --json, "headRefOid"] }
      github_check_runs_fallback: { program: gh, argv: [api, "repos/{repo}/commits/{headRefOid}/check-runs?per_page=100"] }
      github_statuses_fallback: { program: gh, argv: [api, "repos/{repo}/commits/{headRefOid}/status?per_page=100"] }
      gitlab: { program: glab, argv: [ci, status,  "-b", "{branch}"] }   # text fallback parsed
    output:
      data:
        state: enum<success|failure|pending|cancelled|neutral|skipped|timed_out>
        required_count: integer
        success_count: integer
        failed: list<{ name, url, conclusion }>
        pending: list<{ name, url }>
        warnings: optional<list<string>>

  - id: pr.wait-checks
    schema_version: cli.forge-cli.pr.checks.v1   # shares schema with pr.checks
    summary: Block until every required check reaches a terminal state.
    inputs:
      - { name: <id>,            type: integer-or-branch, required: true }
      - { name: --timeout,       type: duration,          default: 30m }
      - { name: --interval,      type: duration,          default: 20s }
      - { name: --required-only, type: bool,              default: true }
      - { name: --allow-no-checks, type: bool,            default: false } # reason-free by design: this op is non-mutating and records no durable decision, so there is no payload field to carry a reason. The mutating siblings (pr.merge, pr.deliver) do require one.
    validations: []
    behaviour: |
      Polls pr.checks until every required check is terminal. An empty gating
      set is NOT terminal (lock-down rule 8): the poll continues through the
      provider's check-registration window instead of reading "nothing is
      failing" as "everything passed". --allow-no-checks makes it terminal for
      a project that configures none. Emits a single envelope at the end.
      Maps results to exit code:
        all success         -> SUCCESS 0
        any failure         -> RUNTIME 1, error.kind=checks_failed
        cancelled/timed_out -> RUNTIME 1, error.kind=checks_failed
        deadline reached,
          checks were seen  -> UNAVAILABLE 69, error.kind=checks_timeout
        deadline reached,
          none ever seen    -> DATA 65, error.kind=checks_not_registered
      On the checks_not_registered emission the envelope carries ok=false while
      data.state is still "success" (the snapshot is reported verbatim), so
      consumers must gate on ok / error.kind, not on data.state.
    backends: inherits-from-pr.checks
    output: inherits-from-pr.checks

  - id: issue.create
    schema_version: cli.forge-cli.issue.create.v1
    summary: Open a new issue.
    inputs:
      - { name: --title,     type: string, required: true }
      - { name: --body,      type: string, required: false }
      - { name: --body-file, type: path,   required: false }
      - { name: --label,     type: list<string>, default: [] }
      - { name: --assignee,  type: list<string>, default: [] }
    validations:
      - title_length
      - no_local_path # title + body
      - no_agent_attribution # title + body
    backends:
      github: { program: gh,   argv: [issue, create, --title, "{title}", --body-file, "{body_file_or_temp}"] }
      gitlab: { program: glab, argv: [issue, create, --title, "{title}", --description, "{body_or_file}"] }
    output:
      data: { number, url, title, state, provider }

  - id: issue.view
    schema_version: cli.forge-cli.issue.view.v1
    summary: Fetch a single issue.
    inputs:
      - { name: <id>, type: integer, required: true }
    backends:
      github: { program: gh,   argv: [issue, view, "{id}", --json, "number,url,state,title,labels,assignees,body"] }
      gitlab: { program: glab, argv: [issue, view, "{id}", -F, json] }

  - id: issue.list
    schema_version: cli.forge-cli.issue.list.v1
    summary: List issues filtered by state / labels / author / assignee.
    inputs:
      - { name: --state,    type: enum<open|closed|all>, default: open }
      - { name: --label,    type: list<string>,          default: [] }
      - { name: --author,   type: string,                required: false }
      - { name: --assignee, type: string,                required: false }
      - { name: --limit,    type: integer,               default: 30 }
    validations: []
    backends:
      github: { program: gh,   argv: [issue, list, --json, "number,url,state,title,labels,author,assignees"] }
      gitlab: { program: glab, argv: [issue, list, -F, json] }
    output:
      data:
        items: list<{ number, url, state, title, labels, author, assignees }>

  - id: issue.edit
    schema_version: cli.forge-cli.issue.edit.v1
    summary: Mutate issue title / body / labels / assignees.
    inputs:
      - { name: <id>,             type: integer,      required: true }
      - { name: --title,          type: string,       required: false }
      - { name: --body,           type: string,       required: false }
      - { name: --body-file,      type: path,         required: false }
      - { name: --add-label,      type: list<string>, default: [] }
      - { name: --remove-label,   type: list<string>, default: [] }
      - { name: --add-assignee,   type: list<string>, default: [] }
    validations:
      - title_length   # when --title supplied
      - no_local_path  # title when --title; body when --body / --body-file
      - no_agent_attribution # title when --title; body when --body / --body-file
    backends:
      github: { program: gh,   argv: [issue, edit,   "{id}"] }
      gitlab: { program: glab, argv: [issue, update, "{id}"] }

  - id: issue.comment
    schema_version: cli.forge-cli.issue.comment.v1
    summary: Append a comment to an issue.
    inputs:
      - { name: <id>,        type: integer, required: true }
      - { name: --body,      type: string,  required: false }
      - { name: --body-file, type: path,    required: false }
    validations:
      - no_local_path # comment body
      - no_agent_attribution # comment body
    backends:
      github: { program: gh,   argv: [issue, comment, "{id}", --body, "{body_or_file}"] }
      gitlab: { program: glab, argv: [issue, note,    "{id}", --message, "{body_or_file}"] }

  - id: issue.close
    schema_version: cli.forge-cli.issue.close.v1
    summary: Close an issue.
    inputs:
      - { name: <id>, type: integer, required: true }
    backends:
      github: { program: gh,   argv: [issue, close, "{id}"] }
      gitlab: { program: glab, argv: [issue, close, "{id}"] }

  - id: issue.reopen
    schema_version: cli.forge-cli.issue.reopen.v1
    summary: Reopen a closed issue.
    inputs:
      - { name: <id>, type: integer, required: true }
    backends:
      github: { program: gh,   argv: [issue, reopen, "{id}"] }
      gitlab: { program: glab, argv: [issue, reopen, "{id}"] }

  - id: label.list
    schema_version: cli.forge-cli.label.list.v1
    summary: List repository labels from the selected provider.
    inputs:
      - { name: --limit, type: integer, default: 200 }
    validations: []
    backends:
      github: { program: gh,   argv: [label, list, --limit, "{limit}", --json, "id,name,color,description"] }
      gitlab: { program: glab, argv: [label, list, --output, json, --per-page, "{limit}"] }
    output:
      data:
        provider: enum<github|gitlab>
        labels: list<{ id, name, color, description }>

  - id: label.audit
    schema_version: cli.forge-cli.label.audit.v1
    summary: Compare repository labels against a caller-owned catalog.
    inputs:
      - { name: --catalog, type: path, required: true }
      - { name: --limit,   type: integer, default: 200 }
    validations: []
    backends:
      github: { derives_from: label.list }
      gitlab: { derives_from: label.list }
    output:
      data:
        provider: enum<github|gitlab>
        status: enum<pass|fail>
        missing: list<{ name, group, color, description, applies_to }>
        drift: "list of { name, current, expected, fields }"
        unknown_shared: list<{ id, name, color, description }>

  - id: label.ensure
    schema_version: cli.forge-cli.label.ensure.v1
    summary: Create missing catalog labels and optionally update color / description drift.
    inputs:
      - { name: --catalog,         type: path, required: true }
      - { name: --update-existing, type: bool, default: false }
      - { name: --limit,           type: integer, default: 200 }
    validations: []
    backends:
      github:
        list: { derives_from: label.list }
        create: { program: gh, argv: [label, create, "{name}", --color, "{color}", --description, "{description}"] }
        update: { program: gh, argv: [label, edit, "{name}", --color, "{color}", --description, "{description}"] }
      gitlab:
        list: { derives_from: label.list }
        create: { program: glab, argv: [label, create, --name, "{name}", --color, "#{color}", --description, "{description}"] }
        update: { program: glab, argv: [label, edit, --label-id, "{id}", --color, "#{color}", --description, "{description}"] }
    output:
      data:
        provider: enum<github|gitlab>
        dry_run: bool
        actions: "list of create/update action plans or applied actions"
    notes: "Never deletes labels or renames labels by default. Existing color / description drift is updated only with --update-existing."

  - id: repo.view
    schema_version: cli.forge-cli.repo.view.v1
    summary: Resolve repo slug, default branch, default merge method.
    inputs: []
    backends:
      github: { program: gh,   argv: [repo, view, "{slug-or-host/slug}", --json, "name,owner,defaultBranchRef,mergeCommitAllowed,squashMergeAllowed,rebaseMergeAllowed,url"], env: { GH_HOST: "{resolved_authority}" } }
      gitlab: { program: glab, argv: [repo, view, "{slug-or-https://host/slug}", -F, json], env: { GITLAB_HOST: "{resolved_authority}" } }
    output:
      data:
        owner: string
        name: string
        url: string
        default_branch: string
        merge_methods_allowed: list<enum<squash|merge|rebase>>

  - id: repo.push-default
    schema_version: cli.forge-cli.repo.push-default.v1
    summary: Deliver exactly one explicitly authorized signed commit to the remote default branch without force.
    inputs:
      - { name: --head,          type: string, default: HEAD }
      - { name: --expected-base, type: full-commit-sha, required: true }
      - { name: --reason-file,   type: path, required: true }
    validations: [worktree_clean, default_branch_protected, direct_default_delivery, no_local_path]
    backends:
      github: { repo: { program: gh, argv: [repo, view, "{host}/{owner}/{repo}", --json, "name,owner,defaultBranchRef,mergeCommitAllowed,squashMergeAllowed,rebaseMergeAllowed,url"] }, push: { program: git, argv: [-c, push.followTags=false, -c, "push.pushOption=", -c, push.recurseSubmodules=no, push, --porcelain, --no-follow-tags, --no-recurse-submodules, --no-push-option, "--force-with-lease=refs/heads/{default_branch}:{expected_base}", --, "{validated_push_url}", "{head_sha}:refs/heads/{default_branch}"] } }
      gitlab: { repo: { program: glab, argv: [repo, view, "https://{host}/{owner}/{repo}", -F, json] }, push: { program: git, argv: [-c, push.followTags=false, -c, "push.pushOption=", -c, push.recurseSubmodules=no, push, --porcelain, --no-follow-tags, --no-recurse-submodules, --no-push-option, "--force-with-lease=refs/heads/{default_branch}:{expected_base}", --, "{validated_push_url}", "{head_sha}:refs/heads/{default_branch}"] } }
    output:
      data:
        provider: enum<github|gitlab>
        repository: string
        remote: string
        default_branch: string
        authoring_branch: string
        head: string
        head_sha: string
        expected_base: string
        reason: string
        push_refspec: string
        pushed: bool
        observed_remote_sha: string
    notes: "No unconstrained force, delete, retry, or direct-merge path exists. The selected authority must match the push URL before metadata lookup, and returned metadata must match that same authority and repository; metadata from another authority cannot authorize the push. Canonical comparison preserves non-default HTTPS ports. The internal exact old-OID lease is a compare-and-swap guard, and the separate ancestry proof keeps the resulting update fast-forward-only. Every Git subprocess has a 120-second timeout and 8 MiB per-stream capture limit with process-group cleanup. Dry-run performs the read-only preflight and emits pushed=false."

  - id: auth.status
    schema_version: cli.forge-cli.auth.status.v1
    summary: Verify backend auth (gh / glab).
    inputs: []
    backends:
      github: { program: gh,   argv: [auth, status, --hostname, "{resolved_authority}"], env: { GH_HOST: "{resolved_authority}" } }
      gitlab: { program: glab, argv: [auth, status, --hostname, "{resolved_authority}"], env: { GITLAB_HOST: "{resolved_authority}" } }
    output:
      data:
        provider: enum<github|gitlab>
        host: string
        user: optional<string>
        scopes: list<string>
    notes: "Backend output is text, parsed into the structured envelope."

  - id: inbox.list
    schema_version: cli.forge-cli.inbox.list.v1
    summary: List normalized personal inbox items across selected providers.
    inputs:
      - { name: --gitlab-host, type: string, default: gitlab.com, scope: inbox-only }
      - { name: --kind,        type: list<enum<review|assigned|todo|authored|involved>>, default: [review, assigned, todo, authored] }
      - { name: --limit,       type: integer, default: 30, semantics: "per provider and per query family" }
    validations: []
    backends:
      github:
        program: gh
        argv:
          - [search, prs, "--review-requested", "@me", --state, open, --sort, updated, --order, desc, --limit, "{limit}", --json, "number,url,title,updatedAt,author,repository"]
          - [search, prs, "--assignee", "@me", --state, open, --sort, updated, --order, desc, --limit, "{limit}", --json, "number,url,title,updatedAt,author,repository"]
          - [search, issues, "--assignee", "@me", --state, open, --sort, updated, --order, desc, --limit, "{limit}", --json, "number,url,title,updatedAt,author,repository"]
          - [search, prs, "--author", "@me", --state, open, --sort, updated, --order, desc, --limit, "{limit}", --json, "number,url,title,updatedAt,author,repository"]
          - [search, issues, "--author", "@me", --state, open, --sort, updated, --order, desc, --limit, "{limit}", --json, "number,url,title,updatedAt,author,repository"]
      gitlab:
        program: glab
        argv:
          - [api, user, --hostname, "{gitlab_host}"]
          - [api, --hostname, "{gitlab_host}", "merge_requests?scope=assigned_to_me&state=opened&order_by=updated_at&sort=desc&per_page={limit}"]
          - [api, --hostname, "{gitlab_host}", "merge_requests?reviewer_username={username}&state=opened&order_by=updated_at&sort=desc&per_page={limit}"]
          - [api, --hostname, "{gitlab_host}", "merge_requests?author_id={user_id}&state=opened&order_by=updated_at&sort=desc&per_page={limit}"]
          - [api, --hostname, "{gitlab_host}", "issues?scope=assigned_to_me&state=opened&order_by=updated_at&sort=desc&per_page={limit}"]
          - [api, --hostname, "{gitlab_host}", "issues?author_id={user_id}&state=opened&order_by=updated_at&sort=desc&per_page={limit}"]
          - [api, --hostname, "{gitlab_host}", "todos?state=pending&order_by=updated_at&sort=desc&per_page={limit}"]
    output:
      data:
        providers: "list of { provider, host, ok, item_count, limited, error? }"
        limit: integer
        items: "list of normalized inbox items"
    notes: "Partial provider success exits 0 with provider errors in data.providers[] and string warnings[]; all selected providers failing exits non-zero."

  - id: inbox.status
    schema_version: cli.forge-cli.inbox.status.v1
    summary: Summarize bounded inbox counts by provider, host, kind, and reason.
    inputs:
      - { name: --gitlab-host, type: string, default: gitlab.com, scope: inbox-only }
      - { name: --kind,        type: list<enum<review|assigned|todo|authored|involved>>, default: [review, assigned, todo, authored] }
      - { name: --limit,       type: integer, default: 30, semantics: "per provider and per query family" }
    validations: []
    backends:
      github: { derives_from: inbox.list }
      gitlab: { derives_from: inbox.list }
    output:
      data:
        providers: "list of provider status rows"
        limit: integer
        item_count: integer
        counts: "list of { provider, host, kind, reason, count, limited }"

  - id: inbox.next
    schema_version: cli.forge-cli.inbox.next.v1
    summary: Return ranked next-action candidates from the normalized inbox.
    inputs:
      - { name: --gitlab-host, type: string, default: gitlab.com, scope: inbox-only }
      - { name: --kind,        type: list<enum<review|assigned|todo|authored|involved>>, default: [review, assigned, todo, authored] }
      - { name: --limit,       type: integer, default: 5, semantics: "returned ranked item count" }
    validations: []
    backends:
      github: { derives_from: inbox.list, query_limit_floor: 30 }
      gitlab: { derives_from: inbox.list, query_limit_floor: 30 }
    output:
      data:
        providers: "list of provider status rows"
        limit: integer
        query_limit: integer
        items: "ranked normalized inbox items"

  # SearchItem (shared across the three search envelopes):
  #   { kind: enum<issue|pr>, number, url, title, state, repo,
  #     matched_field: optional<string> }   # matched_field is null on the gh path

  - id: search.issues
    schema_version: cli.forge-cli.search.issues.v1
    summary: Full-text search over issues via the provider search primitive.
    inputs:
      - { name: <query>, type: string,                          required: true }
      - { name: --match, type: list<enum<title|body|comments>>, default: [title, body, comments] }
      - { name: --limit, type: integer,                         default: 30 }
    validations:
      - repo_required
    backends:
      github: { program: gh, argv: [search, issues, "{query}", --repo, "{raw_owner/name_slug}", --match, "{match_csv}", --limit, "{limit}", --json, "number,title,url,state,repository,isPullRequest"], env: { GH_HOST: "{resolved_authority}" } }
      gitlab: provider_unsupported   # search is GitHub-only in v1
      local:  provider_unsupported
    output:
      data:
        provider: enum<github>
        host: string
        repo: string
        query: string
        match_fields: list<enum<title|body|comments>>
        limit: integer
        item_count: integer
        limited: bool
        items: list<SearchItem>
    notes: "Single-repo scoped via --repo or a same-authority detected remote. gh search receives the raw owner/name slug through --repo while GH_HOST selects the resolved authority separately. GitLab/Local return provider_unsupported, never a silent empty result."

  - id: search.prs
    schema_version: cli.forge-cli.search.prs.v1
    summary: Full-text search over pull requests via the provider search primitive.
    inputs:
      - { name: <query>, type: string,                          required: true }
      - { name: --match, type: list<enum<title|body|comments>>, default: [title, body, comments] }
      - { name: --limit, type: integer,                         default: 30 }
    validations:
      - repo_required
    backends:
      github: { program: gh, argv: [search, prs, "{query}", --repo, "{raw_owner/name_slug}", --match, "{match_csv}", --limit, "{limit}", --json, "number,title,url,state,repository,isPullRequest"], env: { GH_HOST: "{resolved_authority}" } }
      gitlab: provider_unsupported
      local:  provider_unsupported
    output:
      data: { provider: enum<github>, host, repo, query, match_fields, limit, item_count, limited, items: list<SearchItem> }

  - id: search.refs-to
    schema_version: cli.forge-cli.search.refs-to.v1
    summary: List issues/PRs that reference a ref via cross-reference events.
    inputs:
      - { name: <ref>,   type: string,  required: true }   # GitHub URL | owner/name#n | #n | n
      - { name: --limit, type: integer, default: 30 }
    validations:
      - repo_required
      - ref_invalid
    backends:
      github: { program: gh, argv: [api, graphql, -F, "owner={owner}", -F, "name={name}", -F, "number={number}", -F, "first={limit}", -f, "query={cross_referenced_event_query}"], env: { GH_HOST: "{resolved_authority}" } }
      gitlab: provider_unsupported
      local:  provider_unsupported
    output:
      data:
        provider: enum<github>
        host: string
        repo: string
        reference_number: integer
        limit: integer
        item_count: integer
        limited: bool
        items: list<SearchItem>
    notes: "Queries the target's CROSS_REFERENCED_EVENT timeline items and normalizes the referencing issues/PRs into SearchItem. <ref> is parsed as a URL, owner/name#n, or #n / n (repo from context)."

# ---------------------------------------------------------------------------
# Macro operations.
# ---------------------------------------------------------------------------
macros:

  - id: pr.deliver
    schema_version: cli.forge-cli.pr.deliver.v1
    summary: End-to-end "open draft (or adopt the branch's open PR) → CI green → ready → merge" flow.
    inputs:
      - { name: --kind,                     type: enum<feature|bug>,            required: true }
      - { name: --title,                    type: string,                       required: false }
      - { name: --body,                     type: string,                       required: false }
      - { name: --body-file,                type: path,                         required: false }
      - { name: --head,                     type: string,                       default: current-branch } # GitHub-only <user>:<branch> seam; user forks only
      - { name: --base,                     type: string,                       default: repo-default-branch }
      - { name: --method,                   type: enum<squash|merge|rebase>,    default: squash }
      - { name: --reviewer,                 type: list<string>,                 default: [] }
      - { name: --label,                    type: list<string>,                 default: [] }
      - { name: --label-catalog,            type: path,                         required: false }
      - { name: --strict-labels,            type: bool,                         default: false }
      - { name: --timeout,                  type: duration,                     default: 30m }
      - { name: --no-merge,                 type: bool,                         default: false }
      - { name: --no-issue-closeout,        type: bool,                         default: false } # skip the post-merge deterministic linked-issue closeout
      - { name: --allow-non-default-base,   type: bool,                         default: false }
      - { name: --allow-unresolved-threads, type: bool,                         default: false } # requires --allow-unresolved-threads-reason
      - { name: --allow-unresolved-threads-reason, type: string,                default: null }
      - { name: --review-convergence,        type: optional<bool>,              default: resolved-config }
      - { name: --allow-unchecked-tasks,    type: bool,                         default: false }
      - { name: --allow-unchecked-tasks-reason, type: string,                   default: null }
      - { name: --allow-no-checks,          type: bool,                         default: false } # requires --allow-no-checks-reason
      - { name: --allow-no-checks-reason,   type: string,                       default: null }
      - { name: --test-first-evidence,      type: path,                         required: false } # forwarded to create and enforced on the adopt path when [test_first].require resolves true
    sequence:
      # Before dry-run/live branching and before provider access, validate
      # strict label inputs for the provider target. This applies equally to
      # create and adopt delivery paths.
      - { step: auth_status,        op: auth.status }
      - { step: repo_view,          op: repo.view }
      # Head-branch lookup (pr.list --state open --head <branch>): an open
      # PR/MR on the resolved head branch is adopted — `adopt` replaces
      # `create` in data.steps[] (payload is the PR's pr.view shape, body
      # re-validated against the body-section gate). When [test_first].require
      # resolves true the adopt path also enforces the test_first_evidence
      # validation, so an adopted feature/bug PR cannot bypass the gate. The
      # lifecycle then resumes at wait_checks. The lookup is not a recorded step.
      # GitHub qualified <user>:<branch> lookup instead lists a bounded open
      # set without --head and selects exact branch + headRepository identity;
      # provider view must then match the local SHA before adoption.
      - { step: adopt,              op: pr.view,   when: "open PR exists for head branch" }
      - { step: create,             op: pr.create, when: "no open PR exists for head branch" }
      # GitHub delivery starts required-only. When that snapshot reports zero
      # required checks but retains visible rows, the macro re-gates those rows
      # as all-checks and polls only if pending, using the same timeout budget.
      # A fully empty check set no longer succeeds: wait_checks treats it as
      # non-terminal and, once the budget expires, fails DATA 65 with
      # checks_not_registered (lock-down rule 8). This applies on GitLab too,
      # where an MR with no pipeline reports the same empty snapshot.
      # --allow-no-checks (+ reason) is the declared opt-out.
      - { step: wait_checks,        op: pr.wait-checks }
      - { step: ready,              op: pr.ready,  skip_when: "--no-merge" }
      - { step: merge,              op: pr.merge,  skip_when: "--no-merge" }
      # After merge, deterministically close every still-open issue the PR
      # references through a `Closes/Fixes #N` closing keyword (GitHub
      # `closingIssuesReferences`), rather than depending on GitHub's
      # asynchronous auto-close. Best-effort: the merge already landed, so a
      # closeout fetch/close failure records an `ok:false` step but never
      # short-circuits. Non-closing `Refs #N` references never appear in
      # `closingIssuesReferences`, so plan-tracking flows are untouched.
      - { step: issue_closeout,     op: issue.closeout, schema_version: cli.forge-cli.issue.closeout.v1, skip_when: "--no-merge or --no-issue-closeout" }
    output:
      data:
        kind: enum<feature|bug>
        provider: enum<github|gitlab>
        review_convergence: optional<resolved<{require, quiet_period, timeout, bots}>> # dry-run merge phase only; absent with --no-merge
        pr:
          number: integer
          url: string
          merged: bool
          merge_sha: optional<string>
        steps: "list of { step, ok, schema_version, payload }"
    notes: |
      Failure of a *pre-merge* step short-circuits the macro. The outer exit
      code is the failing step's exit code (no remapping). Steps that did not
      run are omitted from `data.steps`. The post-merge `issue_closeout` step
      is best-effort: it cannot short-circuit (the merge already landed) and
      surfaces per-issue outcomes (`closed` / `already_closed` / `error`) plus
      an aggregate `ok`.

# ---------------------------------------------------------------------------
# Output envelope (matches cli-output-contract-v1).
# ---------------------------------------------------------------------------
envelope:
  fields:
    schema_version: "cli.forge-cli.<op>.v<N>"
    ok: bool
    data: optional<object>
    warnings: optional<list<string>>
  error_extension:
    data.error:
      kind: string          # discriminator, e.g. branch_name_invalid
      message: string       # short, human-readable
      detail: optional<string>  # backend stderr tail, redacted, <=2 KiB

# ---------------------------------------------------------------------------
# Exit code map (aligned with cli-output-contract-v1 sysexits).
# ---------------------------------------------------------------------------
exit_codes:
  SUCCESS:     { value: 0,  triggers: ["op completed; required state achieved"] }
  RUNTIME:     { value: 1,  triggers: ["required checks failed", "merge conflict", "remote semantic failure"] }
  USAGE:       { value: 64, triggers: ["bad CLI syntax", "unknown subcommand", "provider_unsupported"] }
  DATA:        { value: 65, triggers: ["any lock-down policy violation", "body parse failed"] }
  UNAVAILABLE: { value: 69, triggers: ["gh/glab missing", "auth required", "remote 5xx", "wait-checks timeout"] }
  SOFTWARE:    { value: 70, triggers: ["backend JSON shape mismatch", "internal invariant violation"] }
