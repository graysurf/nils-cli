# forge-cli operation catalog v1.
#
# Machine-readable companion to `forge-cli-spec-v1.md`. The spec is
# the source of truth for prose, rationale, and contract conformance;
# this file enumerates every atom + macro for the v1 surface so the
# Rust implementation, the backend wrappers, and the test fixtures
# can be generated from a single declaration.
#
# Validation rule names referenced from `validations:` are defined
# at the top of the file under `validations_catalog`. The spec
# describes their semantics; the names below are the keys an
# implementation can match on.

version: 1
binary: forge-cli
schema_prefix: cli.forge-cli

# ---------------------------------------------------------------------------
# Shared validation catalog. Each op picks the subset it enforces.
# ---------------------------------------------------------------------------
validations_catalog:
  branch_name:
    rule: "^(feat|fix)/[a-z0-9][a-z0-9-]{1,63}$"
    error_kind: branch_name_invalid
    exit: DATA
  branch_kind_matches:
    rule: "feature -> feat/*, bug -> fix/*"
    error_kind: branch_kind_mismatch
    exit: DATA
  body_summary:
    rule: "non-empty H2 `## Summary` section"
    error_kind: body_missing_summary
    exit: DATA
  body_test_plan:
    rule: "non-empty H2 `## Test plan` section"
    error_kind: body_missing_test_plan
    exit: DATA
  title_length:
    rule: "len(title) <= 70 and no trailing whitespace"
    error_kind: title_too_long
    exit: DATA
  no_local_path:
    rule: "posted title/body/comment text must not embed a machine-local home path (/Users/<owner>/... or /home/<owner>/...); diagnostics name the source and line with a $HOME-relative fix without echoing the original path; allowlist /home/agent, /home/linuxbrew, /home/runner; bypass with FORGE_CLI_ALLOW_LOCAL_PATH=1"
    error_kind: local_path_present
    exit: DATA
  worktree_clean:
    rule: "git status --porcelain is empty"
    error_kind: dirty_worktree
    exit: DATA
  head_pushed:
    rule: "resolved head branch has upstream and matches remote-tracking ref"
    error_kind: head_not_pushed
    exit: DATA
  default_branch_protected:
    rule: "refuse force-push / direct merge to repo default branch"
    error_kind: default_branch_protected
    exit: DATA
  draft_merge_refused:
    rule: "pr.draft == false at merge time"
    error_kind: draft_merge_refused
    exit: DATA
  required_checks_green:
    rule: "every required check is success at merge time"
    error_kind: checks_pending     # exit DATA when pending
    failed_error_kind: checks_failed  # exit RUNTIME when failed
  merge_method_supported:
    rule: "method in {squash, merge, rebase} and backend supports it"
    error_kind: merge_method_unsupported
    exit: DATA
  keep_branch_conflict:
    rule: "--keep-branch and --delete-branch are mutually exclusive"
    error_kind: keep_branch_conflict
    exit: DATA
  review_threads_resolved:
    rule: "no unresolved review threads at merge time unless --allow-unresolved-threads is set"
    error_kind: unresolved_review_threads
    exit: DATA
  tasklist_complete:
    rule: "no unchecked task-list items in the PR/MR description at merge time unless --allow-unchecked-tasks (with --allow-unchecked-tasks-reason) is set"
    error_kind: unchecked_task_items
    exit: DATA
  label_catalog:
    rule: "when --strict-labels is set, every selected label exists in --label-catalog, applies to the target, and exclusive groups do not conflict"
    error_kind: label_unknown | label_not_applicable | label_group_conflict | label_catalog_missing
    exit: DATA
  repo_required:
    rule: "search resolves a single repo slug from --repo or the detected forge remote"
    error_kind: repo_required
    exit: DATA
  ref_invalid:
    rule: "search refs-to <ref> parses as a GitHub URL, owner/name#number, or #number / number"
    error_kind: ref_invalid
    exit: DATA
  test_first_evidence:
    rule: "when [test_first].require resolves true (repo or global config) and --kind is feature/bug, --test-first-evidence <dir> must point at a verified test-first-evidence record (a failing test or explicit waiver plus a passing final validation); docs/chore/ci/refactor are exempt"
    error_kind: test_first_evidence_required | test_first_evidence_incomplete | test_first_evidence_unreadable
    exit: DATA

# ---------------------------------------------------------------------------
# Global flags every subcommand inherits.
# ---------------------------------------------------------------------------
global_flags:
  - name: --format
    type: enum<text|json>
    default: text
  - name: --remote
    type: string
    default: origin
  - name: --provider
    type: enum<github|gitlab>
    default: auto
  - name: --repo
    type: string  # owner/name slug
    default: derived-from-remote
  - name: --dry-run
    type: bool
    default: false

# ---------------------------------------------------------------------------
# Atomic operations.
# ---------------------------------------------------------------------------
operations:

  - id: pr.create
    schema_version: cli.forge-cli.pr.create.v1
    summary: Open a draft pull/merge request from the current branch.
    inputs:
      - { name: --head,        type: string,         default: current-branch }
      - { name: --base,        type: string,         default: repo-default-branch }
      - { name: --title,       type: string,         required: true }
      - { name: --body,        type: string,         required: false }
      - { name: --body-file,   type: path,           required: false }
      - { name: --kind,        type: enum<feature|bug>, required: true }
      - { name: --draft,       type: bool,           default: true }
      - { name: --reviewer,    type: list<string>,   default: [] }
      - { name: --label,       type: list<string>,   default: [] }
      - { name: --label-catalog, type: path,          required: false }
      - { name: --strict-labels, type: bool,          default: false }
      - { name: --test-first-evidence, type: path,    required: false } # required only when [test_first].require resolves true for feature/bug
    validations:
      - branch_name
      - branch_kind_matches
      - title_length
      - no_local_path # title + body
      - body_summary
      - body_test_plan
      - label_catalog # only when --strict-labels is set
      - worktree_clean
      - head_pushed
      - test_first_evidence # only when [test_first].require resolves true
    backends:
      github:
        program: gh
        argv: [pr, create, "--draft", "--head", "{head}", "--base", "{base}", "--title", "{title}", "--body-file", "{body_file_or_temp}"]
        json: { read_after: true, command: [pr, view, "{number}", --json, "number,url,headRefName,baseRefName,isDraft,title"] }
      gitlab:
        program: glab
        argv: [mr, create, "--draft", "--source-branch", "{head}", "--target-branch", "{base}", "--title", "{title}", "--description", "{body_or_body_file}"]
        json: { read_after: true, command: [mr, view, "{iid}", -F, json] }
    output:
      data:
        number: integer
        url: string
        head: string
        base: string
        draft: bool
        title: string
        kind: enum<feature|bug>
        provider: enum<github|gitlab>

  - id: pr.view
    schema_version: cli.forge-cli.pr.view.v1
    summary: Fetch a single PR/MR with normalised fields.
    inputs:
      - { name: <id>, type: integer-or-branch, required: true }
    validations: []
    backends:
      github: { program: gh,   argv: [pr,   view, "{id}", --json, "number,url,state,isDraft,title,headRefName,baseRefName,mergeable,mergedAt,mergeCommit,labels,body"] }
      gitlab: { program: glab, argv: [mr,   view, "{id}", -F, json] }
    output:
      data:
        number: integer
        url: string
        state: enum<open|closed|merged>
        draft: bool
        title: string
        head: string
        base: string
        mergeable: enum<yes|no|unknown>
        merged_at: optional<string>
        merge_commit_sha: optional<string>
        labels: list<string>
        body: optional<string>   # GitHub `body` / GitLab `description`; null when the response omits it

  - id: pr.list
    schema_version: cli.forge-cli.pr.list.v1
    summary: List PRs/MRs filtered by author / state / branch.
    inputs:
      - { name: --state,  type: enum<open|closed|merged|all>, default: open }
      - { name: --author, type: string,                       required: false }
      - { name: --head,   type: string,                       required: false }
      - { name: --limit,  type: integer,                      default: 30 }
    validations: []
    backends:
      github: { program: gh,   argv: [pr, list, --json, "number,url,state,title,headRefName,author"] }
      gitlab: { program: glab, argv: [mr, list, -F, json] }
    output:
      data:
        items: list<{ number, url, state, title, head, author }>

  - id: pr.edit
    schema_version: cli.forge-cli.pr.edit.v1
    summary: Mutate PR/MR title, body, base, labels, reviewers.
    inputs:
      - { name: <id>,        type: integer, required: true }
      - { name: --title,     type: string,  required: false }
      - { name: --body,      type: string,  required: false }
      - { name: --body-file, type: path,    required: false }
      - { name: --base,      type: string,  required: false }
      - { name: --add-label,    type: list<string>, default: [] }
      - { name: --remove-label, type: list<string>, default: [] }
      - { name: --add-reviewer, type: list<string>, default: [] }
    validations:
      - title_length   # when --title supplied
      - no_local_path  # title when --title; body when --body / --body-file
      - body_summary   # when --body or --body-file supplied
      - body_test_plan # when --body or --body-file supplied
    backends:
      github: { program: gh,   argv: [pr, edit,   "{id}"] }
      gitlab: { program: glab, argv: [mr, update, "{id}"] }

  - id: pr.comment
    schema_version: cli.forge-cli.pr.comment.v1
    summary: Append a comment to a PR/MR.
    inputs:
      - { name: <id>,        type: integer, required: true }
      - { name: --body,      type: string,  required: false }
      - { name: --body-file, type: path,    required: false }
    validations:
      - no_local_path # comment body
    backends:
      github: { program: gh,   argv: [pr, comment, "{id}", --body, "{body_or_file}"] }
      gitlab: { program: glab, argv: [mr, note,    "{id}", --message, "{body_or_file}"] }

  - id: pr.review
    schema_version: cli.forge-cli.pr.review.v1
    summary: Post an already-rendered review outcome to a PR/MR and optionally mirror issue activity.
    inputs:
      - { name: <id>,             type: integer, required: true }
      - { name: --decision,       type: enum<comments-only|approve|request-changes>, default: comments-only }
      - { name: --comment,        type: string,  required: false }
      - { name: --comment-file,   type: path,    required: false }
      - { name: --lens,           type: list<string>, default: [] }
      - { name: --issue,          type: integer, required: false }
      - { name: --mirror-issue,   type: bool,    default: false }
      - { name: --submit-review,  type: bool,    default: false } # GitHub-only: submit a native review event (#pullrequestreview-) instead of an outcome comment; --decision maps to event (comments-only->COMMENT, approve->APPROVE, request-changes->REQUEST_CHANGES); body required for COMMENT/REQUEST_CHANGES, optional for APPROVE
      - { name: --thread-file,    type: path,    required: false } # GitHub-only JSON array of actionable review-thread specs; requires --submit-review; max 256 KiB, 50 specs, 1024-byte paths, 16 KiB bodies. Use only for findings that should be repaired then resolved via pr review-threads resolve.
    validations:
      - no_local_path # review comment body, thread spec bodies/paths, AND the generated issue mirror (lens values are user-controlled), validated before any post
      - no_escaped_control_markdown # review comment body, thread spec bodies/paths, AND the generated issue mirror, validated before any post
    # Op-specific error kinds:
    #   issue_required (DATA 65)       — --mirror-issue without --issue
    #   id_not_pull_request (DATA 65)  — GitHub <id> is not a pull request (the guard saw HTTP 404)
    #   invalid_review_thread_spec (DATA 65) — malformed, oversized, or locally invalid thread spec fields
    #   thread_file_requires_submit_review (DATA 65) — --thread-file without --submit-review
    #   provider_unsupported (USAGE 64) — --submit-review or --thread-file on gitlab/local (native review/thread creation is GitHub-only in v1)
    #   github_native_review_rejected (RUNTIME 1) — GitHub rejected native review submission with HTTP 422; retry with an eligible reviewer identity or omit --submit-review for an outcome comment fallback
    #   github_review_thread_rejected (RUNTIME 1) — GitHub rejected addPullRequestReviewThread for one spec; detail preserves the raw backend error plus spec index/path/line after best-effort pending-review cleanup.
    # A non-404 guard failure (rate limit, 5xx, forbidden/SSO) surfaces as backend_error (RUNTIME 1),
    # not id_not_pull_request, since it may have hit a valid PR.
    backends:
      github:
        - { program: gh, argv: [api, "repos/{repo}/pulls/{id}", --jq, ".number"] } # PR-existence guard; <id> must be a pull request before posting (also rendered in --dry-run as guard_plan)
        - { program: gh, argv: [api, "repos/{repo}/issues/{id}/comments", --method, POST, --raw-field, "body={comment_or_file}", --jq, ".html_url"] } # default (outcome comment)
        - { program: gh, argv: [api, "repos/{repo}/pulls/{id}/reviews", --method, POST, --raw-field, "body={comment_or_file}", --raw-field, "event={EVENT}", --jq, ".html_url"] } # with --submit-review (native review event); body field omitted for a body-less APPROVE; review authored by the inherited gh token's identity
        - { program: gh, argv: [api, graphql, -f, "query=<pull request id lookup>", -f, "owner={owner}", -f, "name={repo}", -F, "number={id}"] } # with --thread-file: resolve the PR node id
        - { program: gh, argv: [api, graphql, -f, "query=<addPullRequestReview>", -f, "pullRequestId={pull_request_id}"] } # with --thread-file: create a pending review
        - { program: gh, argv: [api, graphql, -f, "query=<addPullRequestReviewThread>", -f, "reviewId={review_id}", -f, "path={path}", -f, "body={thread_body}", -F, "line={line}", -f, "side={LEFT|RIGHT}", -f, "subjectType={LINE|FILE}"] } # repeated for each actionable thread spec; returns PRRT_* id and comment URL
        - { program: gh, argv: [api, graphql, -f, "query=<submitPullRequestReview>", -f, "reviewId={review_id}", -f, "event={EVENT}", -f, "body={comment_or_file}"] } # publishes the pending review created for --thread-file
        - { program: gh, argv: [api, graphql, -f, "query=<deletePullRequestReview>", -f, "reviewId={review_id}"] } # best-effort cleanup only when a --thread-file run fails after pending review creation and before publish
        - { program: gh, argv: [api, "repos/{repo}/issues/{issue}/comments", --method, POST, --raw-field, "body=<generated mirror>", --jq, ".html_url"] } # only with --mirror-issue
      gitlab:
        # One `glab mr note create --help` probe selects the form (covers every glab version class):
        #   advertises --resolvable        -> non-resolvable status note (does not block the merge gate)
        - { program: glab, argv: [mr, note, create, "{id}", --message, "{comment_or_file}", "--resolvable=false"] }
        #   `create` exists, no --resolvable -> same subcommand without the flag (note stays resolvable)
        - { program: glab, argv: [mr, note, create, "{id}", --message, "{comment_or_file}"] }
        #   no `create` subcommand          -> bare note form (the only form such builds support)
        - { program: glab, argv: [mr, note, "{id}", --message, "{comment_or_file}"] }
        - { program: glab, argv: [issue, note, "{issue}", --message, "<generated mirror>"] } # only with --mirror-issue
      # local: provider_unsupported in v1; local PR mutation is not modelled.
    output:
      data:
        provider: enum<github|gitlab>
        number: integer
        decision: enum<comments-only|approve|request-changes>
        submitted_review: bool # true when a native review event was submitted (--submit-review); then pr_comment_url is the #pullrequestreview- URL
        pr_comment_url: string
        issue_number: integer?
        issue_comment_url: string?
        mirrored: bool
        lenses: list<string>
        review_threads?: list<{ id: string, url: string, path: string, line?: integer, subject_type: enum<LINE|FILE> }>

  - id: pr.review.validate
    schema_version: cli.forge-cli.pr.review.validate.v1
    summary: Validate review summary and review-thread specs before posting provider-visible review activity.
    inputs:
      - { name: <id>,           type: integer, required: false } # required with --check-diff
      - { name: --comment,      type: string,  required: false }
      - { name: --comment-file, type: path,    required: false }
      - { name: --thread-file,  type: path,    required: false }
      - { name: --check-diff,   type: bool,    default: false } # GitHub-only in v1; validates thread paths/lines against live PR diff
    validations:
      - no_local_path # review comment body plus thread spec bodies/paths
      - no_escaped_control_markdown # review comment body plus thread spec bodies/paths
    # Op-specific error kinds:
    #   invalid_review_thread_spec (DATA 65) — malformed, oversized, or locally invalid thread spec fields
    #   review_validate_id_required (DATA 65) — --check-diff without <id>
    #   review_thread_file_not_changed (DATA 65) — a thread spec path is absent from the live GitHub PR file list
    #   review_thread_line_not_in_diff (DATA 65) — a line thread points at a line that is not commentable on the requested diff side
    #   review_thread_range_not_in_diff (DATA 65) — a ranged thread is reversed or spans multiple diff hunks
    #   provider_unsupported (USAGE 64) — --check-diff on gitlab/local (live diff-coordinate validation is GitHub-only in v1)
    dry_run:
      offline: true
      plan_field: diff_plan
      note: "With --check-diff, emits the planned GitHub PR files argv and leaves review_threads.diff_checked=false."
    backends:
      github:
        - { program: gh, argv: [api, "repos/{repo}/pulls/{id}/files", --paginate] } # only with --check-diff
      # gitlab/local: local schema/privacy validation only; --check-diff returns provider_unsupported.
    output:
      data:
        provider: enum<github|gitlab|local>
        number: integer?
        check_diff: bool
        diff_plan: list<string>? # dry-run only when --check-diff is set
        comment: { present: bool, bytes: integer, lines: integer }
        review_threads:
          count: integer
          diff_checked: bool
          specs: list<{ index: integer, path: string, line?: integer, side: enum<LEFT|RIGHT>, start_line?: integer, start_side?: enum<LEFT|RIGHT>, subject_type: enum<LINE|FILE>, body_bytes: integer }>

  - id: pr.ready
    schema_version: cli.forge-cli.pr.ready.v1
    summary: Promote a draft PR/MR to ready-for-review.
    inputs:
      - { name: <id>, type: integer, required: true }
    validations:
      - worktree_clean
    backends:
      github: { program: gh,   argv: [pr, ready,  "{id}"] }
      gitlab: { program: glab, argv: [mr, update, "{id}", "--ready"] }

  - id: pr.review-threads
    schema_version: cli.forge-cli.pr.review-threads.v1
    summary: List review threads attached to a PR/MR with their resolved state.
    inputs:
      - { name: <id>, type: integer, required: true }
    dry_run:
      offline: true
      repo_resolution: "--repo owner/name or recognised forge remote"
    backends:
      github: { program: gh,   argv: [api, graphql, "--hostname <host when host != github.com>", -f, "query=<reviewThreads query>", -f, "owner={owner}", -f, "name={name}", -F, "pr={id}"] }
      gitlab: { program: glab, argv: [api, --paginate, --hostname, "{host}", "projects/{project}/merge_requests/{id}/discussions?per_page=100"] }
      # local: no review-thread model; returns an empty thread list.
    output:
      data:
        number: integer
        url: string
        total: integer
        unresolved: integer
        threads: list<{id, resolved, outdated, author, path, created_at, url, body}>

  - id: pr.review-threads.resolve
    schema_version: cli.forge-cli.pr.review-threads.resolve.v1
    summary: Resolve a review thread, optionally posting a reply first (GitHub-only in v1).
    inputs:
      - { name: <id>,        type: integer, required: true }
      - { name: --thread,    type: string,  required: true }   # thread node id (PRRT_...)
      - { name: --note,      type: string,  required: false }  # optional reply posted before resolving
      - { name: --note-file, type: path,    required: false }
    validations:
      - no_local_path # optional reply note
      - review_thread_pr_mismatch # live GitHub only: --thread must belong to <id> before mutation
    backends:
      # With a note: the reply mutation runs first, then resolve. Without a
      # note: only resolve. resolveReviewThread is idempotent — resolving an
      # already-resolved thread succeeds rather than erroring.
      github:
        - { program: gh, argv: [api, graphql, "--hostname <host when host != github.com>", -f, "query=<addPullRequestReviewThreadReply>", -f, "tid={thread}", -f, "body={note_or_file}"] }  # only when --note/--note-file given
        - { program: gh, argv: [api, graphql, "--hostname <host when host != github.com>", -f, "query=<resolveReviewThread>", -f, "tid={thread}"] }
      gitlab: unsupported  # no GitHub-shaped thread-mutation surface in v1 → provider_unsupported (USAGE 64)
      # local: no thread model → provider_unsupported (USAGE 64).
    output:
      data:
        provider: enum<github>
        thread_id: string
        resolved: bool
        replied: bool

  - id: pr.review-threads.reply
    schema_version: cli.forge-cli.pr.review-threads.reply.v1
    summary: Reply to a review thread without resolving it (GitHub-only in v1).
    inputs:
      - { name: <id>,        type: integer, required: true }
      - { name: --thread,    type: string,  required: true }   # thread node id (PRRT_...)
      - { name: --body,      type: string,  required: false }
      - { name: --body-file, type: path,    required: false }
    validations:
      - no_local_path # reply body
      - review_thread_pr_mismatch # live GitHub only: --thread must belong to <id> before mutation
    backends:
      github: { program: gh, argv: [api, graphql, "--hostname <host when host != github.com>", -f, "query=<addPullRequestReviewThreadReply>", -f, "tid={thread}", -f, "body={body_or_file}"] }
      gitlab: unsupported  # provider_unsupported (USAGE 64)
      # local: provider_unsupported (USAGE 64).
    output:
      data:
        provider: enum<github>
        thread_id: string
        comment_url: string

  - id: pr.tasks
    schema_version: cli.forge-cli.pr.tasks.v1
    summary: List GFM task-list items in the PR/MR description with their state.
    inputs:
      - { name: <id>, type: integer, required: true }
    backends:
      github: { program: gh,   argv: [pr, view, "{id}", --json, "number,url,body"] }
      gitlab: { program: glab, argv: [mr, view, "{id}", -F, json] }
      # local: no body model; returns an empty item list.
    output:
      data:
        number: integer
        url: string
        total: integer
        unchecked: integer
        items: list<{checked, marker, text, line}>

  - id: pr.merge
    schema_version: cli.forge-cli.pr.merge.v1
    summary: Merge a ready PR/MR with the configured method.
    inputs:
      - { name: <id>,                       type: integer,                       required: true }
      - { name: --method,                   type: enum<squash|merge|rebase>,     default: squash }
      - { name: --keep-branch,              type: bool,                          default: false }
      - { name: --allow-non-default-base,   type: bool,                          default: false }
      - { name: --allow-unresolved-threads, type: bool,                          default: false }
      - { name: --allow-unchecked-tasks,    type: bool,                          default: false }
      - { name: --allow-unchecked-tasks-reason, type: string,                    default: null }
    validations:
      - worktree_clean
      - draft_merge_refused
      - default_branch_protected
      - required_checks_green   # TTL-zero re-check
      - merge_method_supported
      - keep_branch_conflict
      - review_threads_resolved
      - tasklist_complete
    backends:
      github: { program: gh,   argv: [pr, merge, "{id}", "--{method}", "--delete-branch?"] }
      gitlab: { program: glab, argv: [mr, merge, "{id}", "--squash?", "--remove-source-branch?"] }
    output:
      data:
        number: integer
        url: string
        merge_sha: string
        method: enum<squash|merge|rebase>
        deleted_branch: bool

  - id: pr.close
    schema_version: cli.forge-cli.pr.close.v1
    summary: Close a PR/MR without merging.
    inputs:
      - { name: <id>, type: integer, required: true }
    validations: []
    backends:
      github: { program: gh,   argv: [pr, close, "{id}"] }
      gitlab: { program: glab, argv: [mr, close, "{id}"] }

  - id: pr.checks
    schema_version: cli.forge-cli.pr.checks.v1
    summary: One-shot snapshot of PR/MR check state.
    inputs:
      - { name: <id>,           type: integer-or-branch, required: true }
      - { name: --required-only, type: bool,             default: true }
    validations: []
    backends:
      github: { program: gh,   argv: [pr, checks, "{id}", --json, "name,state,bucket,workflow,link,startedAt,completedAt,description"] }
      github_required: { program: gh, argv: [pr, checks, "{id}", --required, --json, "name,state,bucket,workflow,link,startedAt,completedAt,description"] }
      gitlab: { program: glab, argv: [ci, status,  "-b", "{branch}"] }   # text fallback parsed
    output:
      data:
        state: enum<success|failure|pending|cancelled|neutral|skipped|timed_out>
        required_count: integer
        success_count: integer
        failed: list<{ name, url, conclusion }>
        pending: list<{ name, url }>

  - id: pr.wait-checks
    schema_version: cli.forge-cli.pr.checks.v1   # shares schema with pr.checks
    summary: Block until every required check reaches a terminal state.
    inputs:
      - { name: <id>,            type: integer-or-branch, required: true }
      - { name: --timeout,       type: duration,          default: 30m }
      - { name: --interval,      type: duration,          default: 20s }
      - { name: --required-only, type: bool,              default: true }
    validations: []
    behaviour: |
      Polls pr.checks until every required check is terminal. Emits
      a single envelope at the end. Maps results to exit code:
        all success         -> SUCCESS 0
        any failure         -> RUNTIME 1, error.kind=checks_failed
        cancelled/timed_out -> RUNTIME 1, error.kind=checks_failed
        deadline reached    -> UNAVAILABLE 69, error.kind=checks_timeout
    backends: inherits-from-pr.checks
    output: inherits-from-pr.checks

  - id: issue.create
    schema_version: cli.forge-cli.issue.create.v1
    summary: Open a new issue.
    inputs:
      - { name: --title,     type: string, required: true }
      - { name: --body,      type: string, required: false }
      - { name: --body-file, type: path,   required: false }
      - { name: --label,     type: list<string>, default: [] }
      - { name: --assignee,  type: list<string>, default: [] }
    validations:
      - title_length
      - no_local_path # title + body
    backends:
      github: { program: gh,   argv: [issue, create, --title, "{title}", --body-file, "{body_file_or_temp}"] }
      gitlab: { program: glab, argv: [issue, create, --title, "{title}", --description, "{body_or_file}"] }
    output:
      data: { number, url, title, state, provider }

  - id: issue.view
    schema_version: cli.forge-cli.issue.view.v1
    summary: Fetch a single issue.
    inputs:
      - { name: <id>, type: integer, required: true }
    backends:
      github: { program: gh,   argv: [issue, view, "{id}", --json, "number,url,state,title,labels,assignees,body"] }
      gitlab: { program: glab, argv: [issue, view, "{id}", -F, json] }

  - id: issue.list
    schema_version: cli.forge-cli.issue.list.v1
    summary: List issues filtered by state / labels / author / assignee.
    inputs:
      - { name: --state,    type: enum<open|closed|all>, default: open }
      - { name: --label,    type: list<string>,          default: [] }
      - { name: --author,   type: string,                required: false }
      - { name: --assignee, type: string,                required: false }
      - { name: --limit,    type: integer,               default: 30 }
    validations: []
    backends:
      github: { program: gh,   argv: [issue, list, --json, "number,url,state,title,labels,author,assignees"] }
      gitlab: { program: glab, argv: [issue, list, -F, json] }
    output:
      data:
        items: list<{ number, url, state, title, labels, author, assignees }>

  - id: issue.edit
    schema_version: cli.forge-cli.issue.edit.v1
    summary: Mutate issue title / body / labels / assignees.
    inputs:
      - { name: <id>,             type: integer,      required: true }
      - { name: --title,          type: string,       required: false }
      - { name: --body,           type: string,       required: false }
      - { name: --body-file,      type: path,         required: false }
      - { name: --add-label,      type: list<string>, default: [] }
      - { name: --remove-label,   type: list<string>, default: [] }
      - { name: --add-assignee,   type: list<string>, default: [] }
    validations:
      - title_length   # when --title supplied
      - no_local_path  # title when --title; body when --body / --body-file
    backends:
      github: { program: gh,   argv: [issue, edit,   "{id}"] }
      gitlab: { program: glab, argv: [issue, update, "{id}"] }

  - id: issue.comment
    schema_version: cli.forge-cli.issue.comment.v1
    summary: Append a comment to an issue.
    inputs:
      - { name: <id>,        type: integer, required: true }
      - { name: --body,      type: string,  required: false }
      - { name: --body-file, type: path,    required: false }
    validations:
      - no_local_path # comment body
    backends:
      github: { program: gh,   argv: [issue, comment, "{id}", --body, "{body_or_file}"] }
      gitlab: { program: glab, argv: [issue, note,    "{id}", --message, "{body_or_file}"] }

  - id: issue.close
    schema_version: cli.forge-cli.issue.close.v1
    summary: Close an issue.
    inputs:
      - { name: <id>, type: integer, required: true }
    backends:
      github: { program: gh,   argv: [issue, close, "{id}"] }
      gitlab: { program: glab, argv: [issue, close, "{id}"] }

  - id: issue.reopen
    schema_version: cli.forge-cli.issue.reopen.v1
    summary: Reopen a closed issue.
    inputs:
      - { name: <id>, type: integer, required: true }
    backends:
      github: { program: gh,   argv: [issue, reopen, "{id}"] }
      gitlab: { program: glab, argv: [issue, reopen, "{id}"] }

  - id: label.list
    schema_version: cli.forge-cli.label.list.v1
    summary: List repository labels from the selected provider.
    inputs:
      - { name: --limit, type: integer, default: 200 }
    validations: []
    backends:
      github: { program: gh,   argv: [label, list, --limit, "{limit}", --json, "id,name,color,description"] }
      gitlab: { program: glab, argv: [label, list, --output, json, --per-page, "{limit}"] }
    output:
      data:
        provider: enum<github|gitlab>
        labels: list<{ id, name, color, description }>

  - id: label.audit
    schema_version: cli.forge-cli.label.audit.v1
    summary: Compare repository labels against a caller-owned catalog.
    inputs:
      - { name: --catalog, type: path, required: true }
      - { name: --limit,   type: integer, default: 200 }
    validations: []
    backends:
      github: { derives_from: label.list }
      gitlab: { derives_from: label.list }
    output:
      data:
        provider: enum<github|gitlab>
        status: enum<pass|fail>
        missing: list<{ name, group, color, description, applies_to }>
        drift: "list of { name, current, expected, fields }"
        unknown_shared: list<{ id, name, color, description }>

  - id: label.ensure
    schema_version: cli.forge-cli.label.ensure.v1
    summary: Create missing catalog labels and optionally update color / description drift.
    inputs:
      - { name: --catalog,         type: path, required: true }
      - { name: --update-existing, type: bool, default: false }
      - { name: --limit,           type: integer, default: 200 }
    validations: []
    backends:
      github:
        list: { derives_from: label.list }
        create: { program: gh, argv: [label, create, "{name}", --color, "{color}", --description, "{description}"] }
        update: { program: gh, argv: [label, edit, "{name}", --color, "{color}", --description, "{description}"] }
      gitlab:
        list: { derives_from: label.list }
        create: { program: glab, argv: [label, create, --name, "{name}", --color, "#{color}", --description, "{description}"] }
        update: { program: glab, argv: [label, edit, --label-id, "{id}", --color, "#{color}", --description, "{description}"] }
    output:
      data:
        provider: enum<github|gitlab>
        dry_run: bool
        actions: "list of create/update action plans or applied actions"
    notes: "Never deletes labels or renames labels by default. Existing color / description drift is updated only with --update-existing."

  - id: repo.view
    schema_version: cli.forge-cli.repo.view.v1
    summary: Resolve repo slug, default branch, default merge method.
    inputs: []
    backends:
      github: { program: gh,   argv: [repo, view, --json, "name,owner,defaultBranchRef,mergeCommitAllowed,squashMergeAllowed,rebaseMergeAllowed,url"] }
      gitlab: { program: glab, argv: [repo, view, -F, json] }
    output:
      data:
        owner: string
        name: string
        url: string
        default_branch: string
        merge_methods_allowed: list<enum<squash|merge|rebase>>

  - id: auth.status
    schema_version: cli.forge-cli.auth.status.v1
    summary: Verify backend auth (gh / glab).
    inputs: []
    backends:
      github: { program: gh,   argv: [auth, status] }
      gitlab: { program: glab, argv: [auth, status] }
    output:
      data:
        provider: enum<github|gitlab>
        host: string
        user: optional<string>
        scopes: list<string>
    notes: "Backend output is text, parsed into the structured envelope."

  - id: inbox.list
    schema_version: cli.forge-cli.inbox.list.v1
    summary: List normalized personal inbox items across selected providers.
    inputs:
      - { name: --gitlab-host, type: string, default: gitlab.com, scope: inbox-only }
      - { name: --kind,        type: list<enum<review|assigned|todo|authored|involved>>, default: [review, assigned, todo, authored] }
      - { name: --limit,       type: integer, default: 30, semantics: "per provider and per query family" }
    validations: []
    backends:
      github:
        program: gh
        argv:
          - [search, prs, "--review-requested", "@me", --state, open, --sort, updated, --order, desc, --limit, "{limit}", --json, "number,url,title,updatedAt,author,repository"]
          - [search, prs, "--assignee", "@me", --state, open, --sort, updated, --order, desc, --limit, "{limit}", --json, "number,url,title,updatedAt,author,repository"]
          - [search, issues, "--assignee", "@me", --state, open, --sort, updated, --order, desc, --limit, "{limit}", --json, "number,url,title,updatedAt,author,repository"]
          - [search, prs, "--author", "@me", --state, open, --sort, updated, --order, desc, --limit, "{limit}", --json, "number,url,title,updatedAt,author,repository"]
          - [search, issues, "--author", "@me", --state, open, --sort, updated, --order, desc, --limit, "{limit}", --json, "number,url,title,updatedAt,author,repository"]
      gitlab:
        program: glab
        argv:
          - [api, user, --hostname, "{gitlab_host}"]
          - [api, --hostname, "{gitlab_host}", "merge_requests?scope=assigned_to_me&state=opened&order_by=updated_at&sort=desc&per_page={limit}"]
          - [api, --hostname, "{gitlab_host}", "merge_requests?reviewer_username={username}&state=opened&order_by=updated_at&sort=desc&per_page={limit}"]
          - [api, --hostname, "{gitlab_host}", "merge_requests?author_id={user_id}&state=opened&order_by=updated_at&sort=desc&per_page={limit}"]
          - [api, --hostname, "{gitlab_host}", "issues?scope=assigned_to_me&state=opened&order_by=updated_at&sort=desc&per_page={limit}"]
          - [api, --hostname, "{gitlab_host}", "issues?author_id={user_id}&state=opened&order_by=updated_at&sort=desc&per_page={limit}"]
          - [api, --hostname, "{gitlab_host}", "todos?state=pending&order_by=updated_at&sort=desc&per_page={limit}"]
    output:
      data:
        providers: "list of { provider, host, ok, item_count, limited, error? }"
        limit: integer
        items: "list of normalized inbox items"
    notes: "Partial provider success exits 0 with provider errors in data.providers[] and string warnings[]; all selected providers failing exits non-zero."

  - id: inbox.status
    schema_version: cli.forge-cli.inbox.status.v1
    summary: Summarize bounded inbox counts by provider, host, kind, and reason.
    inputs:
      - { name: --gitlab-host, type: string, default: gitlab.com, scope: inbox-only }
      - { name: --kind,        type: list<enum<review|assigned|todo|authored|involved>>, default: [review, assigned, todo, authored] }
      - { name: --limit,       type: integer, default: 30, semantics: "per provider and per query family" }
    validations: []
    backends:
      github: { derives_from: inbox.list }
      gitlab: { derives_from: inbox.list }
    output:
      data:
        providers: "list of provider status rows"
        limit: integer
        item_count: integer
        counts: "list of { provider, host, kind, reason, count, limited }"

  - id: inbox.next
    schema_version: cli.forge-cli.inbox.next.v1
    summary: Return ranked next-action candidates from the normalized inbox.
    inputs:
      - { name: --gitlab-host, type: string, default: gitlab.com, scope: inbox-only }
      - { name: --kind,        type: list<enum<review|assigned|todo|authored|involved>>, default: [review, assigned, todo, authored] }
      - { name: --limit,       type: integer, default: 5, semantics: "returned ranked item count" }
    validations: []
    backends:
      github: { derives_from: inbox.list, query_limit_floor: 30 }
      gitlab: { derives_from: inbox.list, query_limit_floor: 30 }
    output:
      data:
        providers: "list of provider status rows"
        limit: integer
        query_limit: integer
        items: "ranked normalized inbox items"

  # SearchItem (shared across the three search envelopes):
  #   { kind: enum<issue|pr>, number, url, title, state, repo,
  #     matched_field: optional<string> }   # matched_field is null on the gh path

  - id: search.issues
    schema_version: cli.forge-cli.search.issues.v1
    summary: Full-text search over issues via the provider search primitive.
    inputs:
      - { name: <query>, type: string,                          required: true }
      - { name: --match, type: list<enum<title|body|comments>>, default: [title, body, comments] }
      - { name: --limit, type: integer,                         default: 30 }
    validations:
      - repo_required
    backends:
      github: { program: gh, argv: [search, issues, "{query}", --repo, "{slug}", --match, "{match_csv}", --limit, "{limit}", --json, "number,title,url,state,repository,isPullRequest"] }
      gitlab: provider_unsupported   # search is GitHub-only in v1
      local:  provider_unsupported
    output:
      data:
        provider: enum<github>
        host: string
        repo: string
        query: string
        match_fields: list<enum<title|body|comments>>
        limit: integer
        item_count: integer
        limited: bool
        items: list<SearchItem>
    notes: "Single-repo scoped via --repo or the detected remote; the slug is always pushed as gh search --repo. GitLab/Local return provider_unsupported, never a silent empty result."

  - id: search.prs
    schema_version: cli.forge-cli.search.prs.v1
    summary: Full-text search over pull requests via the provider search primitive.
    inputs:
      - { name: <query>, type: string,                          required: true }
      - { name: --match, type: list<enum<title|body|comments>>, default: [title, body, comments] }
      - { name: --limit, type: integer,                         default: 30 }
    validations:
      - repo_required
    backends:
      github: { program: gh, argv: [search, prs, "{query}", --repo, "{slug}", --match, "{match_csv}", --limit, "{limit}", --json, "number,title,url,state,repository,isPullRequest"] }
      gitlab: provider_unsupported
      local:  provider_unsupported
    output:
      data: { provider: enum<github>, host, repo, query, match_fields, limit, item_count, limited, items: list<SearchItem> }

  - id: search.refs-to
    schema_version: cli.forge-cli.search.refs-to.v1
    summary: List issues/PRs that reference a ref via cross-reference events.
    inputs:
      - { name: <ref>,   type: string,  required: true }   # GitHub URL | owner/name#n | #n | n
      - { name: --limit, type: integer, default: 30 }
    validations:
      - ref_invalid
    backends:
      github: { program: gh, argv: [api, graphql, -F, "owner={owner}", -F, "name={name}", -F, "number={number}", -F, "first={limit}", -f, "query={cross_referenced_event_query}"] }
      gitlab: provider_unsupported
      local:  provider_unsupported
    output:
      data:
        provider: enum<github>
        host: string
        repo: string
        reference_number: integer
        limit: integer
        item_count: integer
        limited: bool
        items: list<SearchItem>
    notes: "Queries the target's CROSS_REFERENCED_EVENT timeline items and normalizes the referencing issues/PRs into SearchItem. <ref> is parsed as a URL, owner/name#n, or #n / n (repo from context)."

# ---------------------------------------------------------------------------
# Macro operations.
# ---------------------------------------------------------------------------
macros:

  - id: pr.deliver
    schema_version: cli.forge-cli.pr.deliver.v1
    summary: End-to-end "open draft (or adopt the branch's open PR) → CI green → ready → merge" flow.
    inputs:
      - { name: --kind,                     type: enum<feature|bug>,            required: true }
      - { name: --title,                    type: string,                       required: false }
      - { name: --body,                     type: string,                       required: false }
      - { name: --body-file,                type: path,                         required: false }
      - { name: --head,                     type: string,                       default: current-branch }
      - { name: --base,                     type: string,                       default: repo-default-branch }
      - { name: --method,                   type: enum<squash|merge|rebase>,    default: squash }
      - { name: --reviewer,                 type: list<string>,                 default: [] }
      - { name: --label,                    type: list<string>,                 default: [] }
      - { name: --label-catalog,            type: path,                         required: false }
      - { name: --strict-labels,            type: bool,                         default: false }
      - { name: --timeout,                  type: duration,                     default: 30m }
      - { name: --no-merge,                 type: bool,                         default: false }
      - { name: --allow-non-default-base,   type: bool,                         default: false }
      - { name: --allow-unresolved-threads, type: bool,                         default: false }
      - { name: --allow-unchecked-tasks,    type: bool,                         default: false }
      - { name: --allow-unchecked-tasks-reason, type: string,                   default: null }
      - { name: --test-first-evidence,      type: path,                         required: false } # forwarded to create and enforced on the adopt path when [test_first].require resolves true
    sequence:
      - { step: auth_status,        op: auth.status }
      - { step: repo_view,          op: repo.view }
      # Head-branch lookup (pr.list --state open --head <branch>): an open
      # PR/MR on the resolved head branch is adopted — `adopt` replaces
      # `create` in data.steps[] (payload is the PR's pr.view shape, body
      # re-validated against the body-section gate). When [test_first].require
      # resolves true the adopt path also enforces the test_first_evidence
      # validation, so an adopted feature/bug PR cannot bypass the gate. The
      # lifecycle then resumes at wait_checks. The lookup is not a recorded step.
      - { step: adopt,              op: pr.view,   when: "open PR exists for head branch" }
      - { step: create,             op: pr.create, when: "no open PR exists for head branch" }
      - { step: wait_checks,        op: pr.wait-checks }
      - { step: ready,              op: pr.ready,  skip_when: "--no-merge" }
      - { step: merge,              op: pr.merge,  skip_when: "--no-merge" }
    output:
      data:
        kind: enum<feature|bug>
        provider: enum<github|gitlab>
        pr:
          number: integer
          url: string
          merged: bool
          merge_sha: optional<string>
        steps: "list of { step, ok, schema_version, payload }"
    notes: |
      Failure of any step short-circuits the macro. The outer exit
      code is the failing step's exit code (no remapping). Steps
      that did not run are omitted from `data.steps`.

# ---------------------------------------------------------------------------
# Output envelope (matches cli-output-contract-v1).
# ---------------------------------------------------------------------------
envelope:
  fields:
    schema_version: "cli.forge-cli.<op>.v<N>"
    ok: bool
    data: optional<object>
    warnings: optional<list<string>>
  error_extension:
    data.error:
      kind: string          # discriminator, e.g. branch_name_invalid
      message: string       # short, human-readable
      detail: optional<string>  # backend stderr tail, redacted, <=2 KiB

# ---------------------------------------------------------------------------
# Exit code map (aligned with cli-output-contract-v1 sysexits).
# ---------------------------------------------------------------------------
exit_codes:
  SUCCESS:     { value: 0,  triggers: ["op completed; required state achieved"] }
  RUNTIME:     { value: 1,  triggers: ["required checks failed", "merge conflict", "remote semantic failure"] }
  USAGE:       { value: 64, triggers: ["bad CLI syntax", "unknown subcommand", "provider_unsupported"] }
  DATA:        { value: 65, triggers: ["any lock-down policy violation", "body parse failed"] }
  UNAVAILABLE: { value: 69, triggers: ["gh/glab missing", "auth required", "remote 5xx", "wait-checks timeout"] }
  SOFTWARE:    { value: 70, triggers: ["backend JSON shape mismatch", "internal invariant violation"] }
