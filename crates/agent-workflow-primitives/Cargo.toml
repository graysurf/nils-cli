[package]
name = "nils-agent-workflow-primitives"
version = "0.28.2"
edition.workspace = true
license.workspace = true

description = "CLI crate for nils-agent-workflow-primitives in the nils-cli workspace."
repository = "https://github.com/sympoies/nils-cli"

[lib]
name = "agent_workflow_primitives"
path = "src/lib.rs"

[[bin]]
name = "agent-run"
path = "src/bin/agent-run.rs"

[[bin]]
name = "browser-session"
path = "src/bin/browser-session.rs"

[[bin]]
name = "canary-check"
path = "src/bin/canary-check.rs"

[[bin]]
name = "docs-impact"
path = "src/bin/docs-impact.rs"

[[bin]]
name = "heuristic-inbox"
path = "src/bin/heuristic-inbox.rs"

[[bin]]
name = "model-cross-check"
path = "src/bin/model-cross-check.rs"

[[bin]]
name = "review-evidence"
path = "src/bin/review-evidence.rs"

[[bin]]
name = "review-specialists"
path = "src/bin/review-specialists.rs"

[[bin]]
name = "repo-retro"
path = "src/bin/repo-retro.rs"

[[bin]]
name = "skill-usage"
path = "src/bin/skill-usage.rs"

[[bin]]
name = "test-first-evidence"
path = "src/bin/test-first-evidence.rs"

[dependencies]
clap = { workspace = true }
clap_complete = { workspace = true }
nils-build-info = { version = "0.28.2", path = "../nils-build-info" }
nils-agent-out = { version = "0.28.2", path = "../agent-out" }
nils-common = { version = "0.28.2", path = "../nils-common", package = "nils-common" }
nils-markdown = { version = "0.28.2", path = "../nils-markdown", package = "nils-markdown" }
nils-term = { version = "0.28.2", path = "../nils-term", package = "nils-term" }
regex = "1"
serde = { workspace = true }
serde_json = { workspace = true }
time = { version = "0.3", features = ["formatting", "local-offset"] }

[dev-dependencies]
nils-test-support = { version = "0.28.2", path = "../nils-test-support" }
pretty_assertions = { workspace = true }
tempfile = "3"
