[package]
name = "agent-runtime-cli"
version = "0.14.0"
edition.workspace = true
license.workspace = true

description = "Render / install / doctor / audit-drift CLI for graysurf/agent-runtime-kit."
repository = "https://github.com/sympoies/nils-cli"

[lib]
name = "agent_runtime_cli"
path = "src/lib.rs"

[[bin]]
name = "agent-runtime"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
indexmap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
sha2 = { workspace = true }
tempfile = "3"
tera = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
nils-test-support = { version = "0.14.0", path = "../nils-test-support" }
