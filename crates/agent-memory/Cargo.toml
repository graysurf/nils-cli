[package]
name = "nils-agent-memory"
version = "1.21.28"
edition.workspace = true
license.workspace = true

description = "CLI crate for nils-agent-memory in the nils-cli workspace."
repository = "https://github.com/sympoies/nils-cli"

[lib]
name = "agent_memory"
path = "src/lib.rs"

[[bin]]
name = "agent-memory"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
clap_complete = { workspace = true }
nils-build-info = { version = "1.21.28", path = "../nils-build-info" }
nils-common = { version = "1.21.28", path = "../nils-common", package = "nils-common" }
serde_json = { workspace = true }

[dev-dependencies]
nils-test-support = { version = "1.21.28", path = "../nils-test-support" }
pretty_assertions = { workspace = true }
tempfile = "3"
