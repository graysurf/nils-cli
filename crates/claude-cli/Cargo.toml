[package]
name = "nils-claude-cli"
version = "1.21.2"
edition.workspace = true
license.workspace = true

description = "CLI crate for nils-claude-cli in the nils-cli workspace."
repository = "https://github.com/sympoies/nils-cli"

[lib]
name = "claude_cli"
path = "src/lib.rs"

[[bin]]
name = "claude-cli"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { workspace = true }
clap_complete = { workspace = true }
nils-build-info = { version = "1.21.2", path = "../nils-build-info" }
nils-common = { version = "1.21.2", path = "../nils-common", package = "nils-common" }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
nils-test-support = { version = "1.21.2", path = "../nils-test-support" }
pretty_assertions = { workspace = true }
tempfile = "3"
