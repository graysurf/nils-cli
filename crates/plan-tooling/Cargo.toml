[package]
name = "nils-plan-tooling"
version = "1.25.6"
edition.workspace = true
license.workspace = true

description = "CLI crate for nils-plan-tooling in the nils-cli workspace."
repository = "https://github.com/sympoies/nils-cli"

[lib]
name = "plan_tooling"
path = "src/lib.rs"

[[bin]]
name = "plan-tooling"
path = "src/main.rs"
[dependencies]
anyhow = { workspace = true }
nils-term = { version = "1.25.6", path = "../nils-term", package = "nils-term" }
nils-common = { version = "1.25.6", path = "../nils-common", package = "nils-common" }
clap = { workspace = true }
clap_complete = { workspace = true }
nils-build-info = { version = "1.25.6", path = "../nils-build-info" }
serde = { workspace = true }
serde_json = { workspace = true }
pulldown-cmark = { workspace = true }
libc = "0.2"

[dev-dependencies]
nils-test-support = { version = "1.25.6", path = "../nils-test-support" }
pretty_assertions = { workspace = true }
tempfile = "3"
