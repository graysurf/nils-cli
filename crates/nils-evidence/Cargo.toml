[package]
name = "nils-evidence"
version = "1.27.20"
edition.workspace = true
license.workspace = true

description = "CLI crate for nils-evidence in the nils-cli workspace."
repository = "https://github.com/sympoies/nils-cli"

[lib]
name = "evidence"
path = "src/lib.rs"

[[bin]]
name = "evidence"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
clap_complete = { workspace = true }
nils-build-info = { version = "1.27.20", path = "../nils-build-info" }
indexmap = { workspace = true }
nils-common = { version = "1.27.20", path = "../nils-common", package = "nils-common" }
nils-scrub = { version = "1.27.20", path = "../nils-scrub" }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
time = { version = "0.3", features = ["formatting"] }

[dev-dependencies]
nils-test-support = { version = "1.27.20", path = "../nils-test-support" }
pretty_assertions = { workspace = true }
tempfile = "3"
