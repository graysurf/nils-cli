[package]
name = "nils-api-test"
version = "1.21.17"
edition.workspace = true
license.workspace = true

description = "CLI crate for nils-api-test in the nils-cli workspace."
repository = "https://github.com/sympoies/nils-cli"

[lib]
name = "api_test"
path = "src/lib.rs"

[[bin]]
name = "api-test"
path = "src/main.rs"
[dependencies]
api-testing-core = { version = "1.21.17", path = "../api-testing-core", package = "nils-api-testing-core" }
clap = { workspace = true }
clap_complete = { workspace = true }
nils-build-info = { version = "1.21.17", path = "../nils-build-info" }
nils-term = { version = "1.21.17", path = "../nils-term", package = "nils-term" }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
nils-test-support = { version = "1.21.17", path = "../nils-test-support" }
pretty_assertions = { workspace = true }
tempfile = "3"
