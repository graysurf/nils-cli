[package]
name = "nils-agent-runtime"
version = "1.27.2"
edition.workspace = true
license.workspace = true

description = "Render / install / doctor / audit-drift CLI for sympoies/agent-runtime-kit."
repository = "https://github.com/sympoies/nils-cli"

[lib]
name = "agent_runtime"
path = "src/lib.rs"

[[bin]]
name = "agent-runtime"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
nils-build-info = { version = "1.27.2", path = "../nils-build-info" }
nils-common = { version = "1.27.2", path = "../nils-common", package = "nils-common" }
indexmap = { workspace = true }
nils-markdown = { version = "1.27.2", path = "../nils-markdown", package = "nils-markdown" }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
sha2 = { workspace = true }
tempfile = "3"
minijinja = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
nils-test-support = { version = "1.27.2", path = "../nils-test-support" }
pretty_assertions = { workspace = true }
