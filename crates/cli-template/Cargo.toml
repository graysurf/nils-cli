[package]
name = "nils-cli-template"
version = "1.27.19"
edition.workspace = true
license.workspace = true

description = "CLI crate for nils-cli-template in the nils-cli workspace."
repository = "https://github.com/sympoies/nils-cli"

[[bin]]
name = "cli-template"
path = "src/main.rs"
[dependencies]
clap = { workspace = true }
nils-build-info = { version = "1.27.19", path = "../nils-build-info" }
nils-common = { version = "1.27.19", path = "../nils-common", package = "nils-common" }
nils-term = { version = "1.27.19", path = "../nils-term", package = "nils-term" }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
nils-test-support = { version = "1.27.19", path = "../nils-test-support" }
pretty_assertions = { workspace = true }
