[package]
name = "nils-agent-session"
version = "1.20.7"
edition.workspace = true
license.workspace = true

description = "CLI crate for nils-agent-session in the nils-cli workspace."
repository = "https://github.com/sympoies/nils-cli"

[lib]
name = "agent_session"
path = "src/lib.rs"

[[bin]]
name = "agent-session"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
clap_complete = { workspace = true }
jiff = { workspace = true }
nils-build-info = { version = "1.20.7", path = "../nils-build-info" }
nils-common = { version = "1.20.7", path = "../nils-common", package = "nils-common" }
serde = { workspace = true }
serde_json = { workspace = true }
shell-words = { workspace = true }

[dev-dependencies]
nils-test-support = { version = "1.20.7", path = "../nils-test-support" }
pretty_assertions = { workspace = true }
tempfile = "3"
