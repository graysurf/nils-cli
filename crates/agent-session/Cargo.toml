[package]
name = "nils-agent-session"
version = "1.27.12"
edition.workspace = true
license.workspace = true

description = "CLI crate for nils-agent-session in the nils-cli workspace."
repository = "https://github.com/sympoies/nils-cli"

[lib]
name = "agent_session"
path = "src/lib.rs"

[[bin]]
name = "agent-session"
path = "src/main.rs"

[[bin]]
name = "main-agent"
path = "src/main_agent_bin.rs"

[dependencies]
clap = { workspace = true }
clap_complete = { workspace = true }
jiff = { workspace = true }
nils-build-info = { version = "1.27.12", path = "../nils-build-info" }
nils-common = { version = "1.27.12", path = "../nils-common", package = "nils-common" }
nils-agent-hook = { version = "1.27.12", path = "../agent-hook" }
nils-provider-resume = { version = "1.27.12", path = "../nils-provider-resume", package = "nils-provider-resume" }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
sha2 = { workspace = true }
shell-words = { workspace = true }
toml_edit = "0.25"
uuid = { version = "1", features = ["v4"] }
# `serve` daemon (control plane + WebSocket PTY attach).
tokio = { workspace = true }
axum = { workspace = true }
futures-util = { workspace = true }
tokio-tungstenite = "0.29"
libc = "0.2"
notify = "8"

[dev-dependencies]
nils-test-support = { version = "1.27.12", path = "../nils-test-support" }
pretty_assertions = { workspace = true }
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }
# `tower::ServiceExt::oneshot` drives the serve Router in tests without binding a socket.
tower = { version = "0.5", features = ["util"] }
