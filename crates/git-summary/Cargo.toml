[package]
name = "nils-git-summary"
version = "1.25.9"
edition.workspace = true
license.workspace = true

description = "CLI crate for nils-git-summary in the nils-cli workspace."
repository = "https://github.com/sympoies/nils-cli"

[[bin]]
name = "git-summary"
path = "src/main.rs"

[lib]
name = "git_summary"
path = "src/lib.rs"

[dependencies]
anyhow = { workspace = true }
chrono = { version = "0.4", features = ["clock"] }
clap = { workspace = true }
clap_complete = { workspace = true }
nils-build-info = { version = "1.25.9", path = "../nils-build-info" }
nils-common = { version = "1.25.9", path = "../nils-common", package = "nils-common" }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
nils-test-support = { version = "1.25.9", path = "../nils-test-support" }
pretty_assertions = { workspace = true }
tempfile = "3"
