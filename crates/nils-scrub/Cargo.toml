[package]
name = "nils-scrub"
version = "1.21.19"
edition.workspace = true
license.workspace = true

description = "Shared secret-scrub library for the nils-cli workspace."
repository = "https://github.com/sympoies/nils-cli"

[lib]
name = "nils_scrub"
path = "src/lib.rs"

[dependencies]
regex = "1"
serde = { workspace = true }

[dev-dependencies]
tempfile = "3"
