[package]
name = "nils-github-app-cli"
version = "1.9.5"
edition.workspace = true
license.workspace = true

description = "CLI crate for nils-github-app-cli in the nils-cli workspace."
repository = "https://github.com/sympoies/nils-cli"

[lib]
name = "github_app_cli"
path = "src/lib.rs"

[[bin]]
name = "github-app-cli"
path = "src/main.rs"

[dependencies]
clap = { workspace = true, features = ["env"] }
clap_complete = { workspace = true }
jsonwebtoken = { version = "9", default-features = false, features = ["use_pem"] }
nils-build-info = { version = "1.9.5", path = "../nils-build-info" }
nils-common = { version = "1.9.5", path = "../nils-common", package = "nils-common" }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
nils-test-support = { version = "1.9.5", path = "../nils-test-support" }
pretty_assertions = { workspace = true }
