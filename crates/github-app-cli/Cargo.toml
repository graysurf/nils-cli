[package]
name = "nils-github-app-cli"
version = "1.11.2"
edition.workspace = true
license.workspace = true

description = "CLI crate for nils-github-app-cli in the nils-cli workspace."
repository = "https://github.com/sympoies/nils-cli"

[lib]
name = "github_app_cli"
path = "src/lib.rs"

[[bin]]
name = "github-app-cli"
path = "src/main.rs"

[dependencies]
clap = { workspace = true, features = ["env"] }
clap_complete = { workspace = true }
# jsonwebtoken 10 split its crypto backend into mutually exclusive `rust_crypto`
# / `aws_lc_rs` features and panics at runtime if neither is selected under
# `default-features = false`. Pick the pure-Rust backend (no C toolchain) to
# match reqwest's rustls choice and keep cross-platform release builds simple.
jsonwebtoken = { version = "10", default-features = false, features = ["use_pem", "rust_crypto"] }
nils-build-info = { version = "1.11.2", path = "../nils-build-info" }
nils-common = { version = "1.11.2", path = "../nils-common", package = "nils-common" }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
nils-test-support = { version = "1.11.2", path = "../nils-test-support" }
pretty_assertions = { workspace = true }
