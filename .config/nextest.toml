# Nextest configuration.
#
# JUnit report output is written to:
#   target/nextest/<profile>/junit.xml
# So with `--profile ci` this becomes:
#   target/nextest/ci/junit.xml

[profile.ci]
# Retry a test that fails then passes, instead of failing the whole run. The
# workspace has a few tests that are reliable in isolation but flake under
# full-workspace parallelism; without retries a single such flake spuriously
# reds the `test` / `test_macos` gate and blocks merge.
#
# A retried pass is recorded as `<flakyFailure>` in `junit.xml` and printed as
# `FLAKY n/m` in the job log, but the published JUnit check does not surface it
# while `flaky_summary` stays at its default, so a masked flake is easy to miss.
#
# This is mitigation. Root-causing the masked flakes and lowering `retries` is
# tracked in #1524 (the follow-up #934 planned but did not open).
retries = 2

# Process-containment fixtures own kernel tracking resources that cannot be
# shared safely across parallel tests. Reserve the full CI thread pool for
# those fixtures so retries do not mask deterministic resource contention.
[[profile.ci.overrides]]
filter = 'package(nils-git-cli) & test(/(supervisor|output_cleanup|detached_double_fork|successful_git_output|signal_terminated_target)/)'
threads-required = "num-test-threads"

# This fixture deliberately queues two adoption workers behind one lease lock.
# Keep unrelated suite load from consuming the bounded lock-wait window.
[[profile.ci.overrides]]
filter = 'package(nils-git-cli) & test(concurrent_adoption_consumes_a_challenge_exactly_once)'
threads-required = "num-test-threads"

# This fixture verifies two products by invoking same-release descriptor
# producers and runtime handlers. Reserve process capacity so full-workspace
# pressure cannot turn OS child-spawn availability into a semantic failure.
[[profile.ci.overrides]]
filter = 'package(nils-agent-hook) & test(enforce_valid_read_only_bypasses_only_the_declared_fallback_handler)'
threads-required = "num-test-threads"

# These fixtures coordinate same-release subprocesses across bounded barrier
# and transcript-observation windows. Give each the complete CI thread pool so
# unrelated coverage work cannot consume the process admission they validate.
[[profile.ci.overrides]]
filter = 'package(nils-agent-session) & test(/(main_agent_worker_start_(definitive_recovery_failure_converges_at_(deadline|final_checkpoint|takeover)_boundary|preserves_ambiguous_initial_enter_without_redelivery|timeout_reports_exact_submitted_prompt|waits_for_late_bootstrap_after_recovery_failure))/)'
threads-required = "num-test-threads"

[profile.ci.junit]
path = "junit.xml"
