# Nextest configuration.
#
# JUnit report output is written to:
#   target/nextest/<profile>/junit.xml
# So with `--profile ci` this becomes:
#   target/nextest/ci/junit.xml

[profile.ci]
# Retry a test that fails then passes, instead of failing the whole run. The
# workspace has a few tests that are reliable in isolation but flake under
# full-workspace parallelism (see issue #934); without retries a single such
# flake spuriously reds the `test` / `test_macos` gate and blocks merge.
# nextest still reports flaky-passes distinctly, so flakes stay visible. This
# is mitigation; the root-cause isolation fix is tracked in #934.
retries = 2

# Process-containment fixtures own kernel tracking resources that cannot be
# shared safely across parallel tests. Reserve the full CI thread pool for
# those fixtures so retries do not mask deterministic resource contention.
[[profile.ci.overrides]]
filter = 'package(nils-git-cli) & test(/(supervisor|output_cleanup|detached_double_fork|successful_git_output|signal_terminated_target)/)'
threads-required = "num-test-threads"

# This end-to-end malformed-state case launches the authenticated process
# supervisor through the copied CLI and deterministically exhausts macOS kqueue
# tracking when it overlaps the full workspace. Keep the typed exit contract
# test isolated rather than weakening fail-closed process containment.
[[profile.ci.overrides]]
filter = 'package(nils-git-cli) & test(adopt_dirty_treats_an_empty_existing_lease_as_malformed_state)'
threads-required = "num-test-threads"

[profile.ci.junit]
path = "junit.xml"
