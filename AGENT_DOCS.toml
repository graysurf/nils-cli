# Finish-line validation contract: code edits in this workspace must run the
# local-fast CI gate before a project-dev task is declared done (agent-docs
# v0.30+). The Stop hook blocks finishing until this command has run since the
# last edit; waivable via AGENT_RUNTIME_VALIDATION_WAIVER=1.
[[validation]]
context = "project-dev"
commands = ["bash scripts/ci/nils-cli-checks-entrypoint.sh --local-fast"]
marker = ".cache/agent-validation/project-dev.ok"
description = "Run the nils-cli local-fast CI gate (fmt, clippy, workspace tests, docs/parity audits) before declaring a project-dev task done."

# Opt in to the project-local skill-name prefix lint (agent-docs v1.0+):
# `agent-docs audit` flags any `.agents/skills/<name>` directory whose name is
# not lowercase kebab-case starting with `project-` or `private-`.
[skills]
enforce_name_prefix = true
